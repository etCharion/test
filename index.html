<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirátské Hledání Pokladů - Retro 90</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0a0a1a 100%);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        /* Retro 90. pozadí s hvězdami */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                              radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                              radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                              radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                              radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 3s linear infinite;
            pointer-events: none;
            z-index: -1;
        }
        
        @keyframes twinkle {
            from { transform: translateY(0px); }
            to { transform: translateY(-10px); }
        }
        
        h1 {
            color: #ffd700;
            margin-bottom: 15px;
            text-align: center;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7), 0 0 20px rgba(255, 215, 0, 0.3);
            letter-spacing: 0.2rem;
            position: relative;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, #ff4500, #ffd700, transparent);
        }
        
        .game-container {
            background: linear-gradient(145deg, #16213e, #0f3460);
            border: 3px solid #ffd700;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), 
                        0 0 40px rgba(255, 215, 0, 0.1),
                        inset 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(to right, transparent, rgba(255,215,0,0.1), transparent);
            border-bottom: 1px solid rgba(255,215,0,0.2);
        }
        
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            padding: 0 10px;
            position: relative;
        }
        
        .info-display {
            background: linear-gradient(135deg, #2a9d8f, #264653);
            color: #ffd700;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            min-width: 70px;
            text-align: center;
            border: 1px solid #ffd700;
            box-shadow: 0 0 10px rgba(42, 157, 143, 0.5);
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        
        .face-button {
            background: linear-gradient(135deg, #e76f51, #c23b22);
            border: 2px solid #ffd700;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #fff;
            box-shadow: 0 0 15px rgba(231, 111, 81, 0.7);
        }
        
        .face-button:hover {
            background: linear-gradient(135deg, #ff4500, #e76f51);
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.9);
        }
        
        .face-button:active {
            transform: scale(0.95);
        }
        
        .game-board-container {
            position: relative;
            border: 2px solid #ffd700;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        
        .game-board {
            display: grid;
            gap: 0;
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            padding: 0;
            border-radius: 3px;
            position: relative;
        }
        
        /* Animované vlny v pozadí hracího pole */
        .game-board::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, 
                rgba(74, 144, 226, 0.1) 0%, 
                transparent 50%, 
                rgba(74, 144, 226, 0.1) 100%);
            background-size: 100px 100px;
            animation: waveBG 8s linear infinite;
            pointer-events: none;
            opacity: 0.5;
        }
        
        @keyframes waveBG {
            0% { transform: translateX(-100px) translateY(-100px); }
            100% { transform: translateX(100px) translateY(100px); }
        }
        
        .cell {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        
        .cell::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(74, 144, 226, 0.3), 
                transparent,
                rgba(74, 144, 226, 0.1));
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .cell:hover::before {
            opacity: 0.5;
        }
        
        .cell:active {
            transform: scale(0.95);
        }
        
        /* Kostičky moře s vlněním */
        .cell.sea {
            background: linear-gradient(135deg, #16213e, #0f3460);
            position: relative;
        }
        
        .cell.sea::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(74, 144, 226, 0.8), 
                rgba(74, 144, 226, 0.4), 
                transparent);
            animation: seaWave 2s ease-in-out infinite;
            animation-delay: var(--wave-delay, 0s);
        }
        
        @keyframes seaWave {
            0%, 100% { 
                opacity: 0.3;
                transform: translateY(0);
            }
            50% { 
                opacity: 0.8;
                transform: translateY(-1px);
            }
        }
        
        .cell.revealed {
            background: linear-gradient(135deg, #2a9d8f, #264653);
            cursor: default;
            border: 1px solid #0f3460;
        }
        
        .cell.revealed.empty {
            background: linear-gradient(135deg, #16213e, #0f3460);
        }
        
        .cell.flagged {
            background: linear-gradient(135deg, #e76f51, #c23b22);
            border: 1px solid #ffd700;
            box-shadow: 0 0 10px rgba(231, 111, 81, 0.5);
        }
        
        .cell.mine {
            background: linear-gradient(135deg, #8b0000, #c23b22);
            color: #fff;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.7);
        }
        
        .cell.mine.exploded {
            background: linear-gradient(135deg, #ff0000, #e76f51);
            color: #fff;
            animation: explode 0.5s ease-out;
        }
        
        @keyframes explode {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        .cell.number-1 { color: #00bfff; text-shadow: 0 0 5px #00bfff; }
        .cell.number-2 { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
        .cell.number-3 { color: #ff0000; text-shadow: 0 0 5px #ff0000; }
        .cell.number-4 { color: #0000ff; text-shadow: 0 0 5px #0000ff; }
        .cell.number-5 { color: #ff69b4; text-shadow: 0 0 5px #ff69b4; }
        .cell.number-6 { color: #00ffff; text-shadow: 0 0 5px #00ffff; }
        .cell.number-7 { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
        .cell.number-8 { color: #ffffff; text-shadow: 0 0 5px #ffffff; }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .difficulty-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #2a9d8f, #264653);
            color: #ffd700;
            border: 2px solid #ffd700;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            box-shadow: 0 0 10px rgba(42, 157, 143, 0.5);
        }
        
        .difficulty-btn:hover {
            background: linear-gradient(135deg, #4ecdc4, #45b7d1);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.7);
        }
        
        .difficulty-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
        }
        
        .instructions {
            margin-top: 20px;
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
            max-width: 600px;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        
        .instructions strong {
            color: #ffd700;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: linear-gradient(135deg, #16213e, #0f3460);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 3px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.1), transparent);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        
        .modal h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
            position: relative;
        }
        
        .modal p {
            color: #e0e0e0;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .modal-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #2a9d8f, #264653);
            color: #ffd700;
            border: 2px solid #ffd700;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            box-shadow: 0 0 15px rgba(42, 157, 143, 0.5);
        }
        
        .modal-btn:hover {
            background: linear-gradient(135deg, #4ecdc4, #45b7d1);
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(78, 205, 196, 0.8);
        }
        
        .modal-btn.restart {
            background: linear-gradient(135deg, #e76f51, #c23b22);
            border-color: #ff4500;
        }
        
        .modal-btn.restart:hover {
            background: linear-gradient(135deg, #ff4500, #e76f51);
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.8);
        }
        
        /* Pirátské ikony */
        .icon {
            font-size: 1.2rem;
        }
        
        @media (max-width: 600px) {
            .cell {
                width: 25px;
                height: 25px;
                font-size: 1rem;
            }
            
            .info-panel {
                flex-direction: column;
                gap: 10px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .modal-content {
                padding: 25px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Pirátské Lov Pokladů</h1>
        
        <div class="info-panel">
            <div class="info-display" id="mines-left">🏴‍☠️</div>
            <button class="face-button" id="face-btn">🏴‍☠️</button>
            <div class="info-display" id="timer">000</div>
        </div>
        
        <div class="game-board-container">
            <div class="game-board" id="game-board"></div>
        </div>
        
        <div class="controls">
            <button class="difficulty-btn" data-difficulty="easy">🏝️ Snadné</button>
            <button class="difficulty-btn" data-difficulty="medium">⚓ Střední</button>
            <button class="difficulty-btn active" data-difficulty="hard">☠️ Těžké</button>
            <button class="difficulty-btn" data-difficulty="custom">⚔️ Vlastní...</button>
        </div>
        
        <div class="instructions">
            <strong>Ovládání:</strong> Levý klik = odhalit, Pravý klik = pirátská vlajka (🏴‍☠️)
        </div>
    </div>
    
    <!-- Modal pro výhru/prohru -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Vyhrál jsi!</h2>
            <p id="modal-message">Gratuluji! Všechny poklady jsi našel bez potopení!</p>
            <button class="modal-btn restart" onclick="restartGame()">Hrát znovu</button>
        </div>
    </div>
    
    <!-- Modal pro vlastní nastavení -->
    <div class="modal" id="custom-modal">
        <div class="modal-content">
            <h2>Vlastní Nastavení</h2>
            <div style="margin: 25px 0; text-align: left;">
                <div style="margin-bottom: 15px;">
                    <label for="custom-rows" style="display: block; margin-bottom: 5px; color: #ffd700; font-weight: bold;">Počet řádků:</label>
                    <input type="number" id="custom-rows" value="15" min="5" max="30" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #2a9d8f; border-radius: 5px; background: #16213e; color: #ffd700; font-size: 1rem;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label for="custom-cols" style="display: block; margin-bottom: 5px; color: #ffd700; font-weight: bold;">Počet sloupců:</label>
                    <input type="number" id="custom-cols" value="15" min="5" max="30" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #2a9d8f; border-radius: 5px; background: #16213e; color: #ffd700; font-size: 1rem;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label for="custom-mines" style="display: block; margin-bottom: 5px; color: #ffd700; font-weight: bold;">Počet kanónů:</label>
                    <input type="number" id="custom-mines" value="50" min="1" max="500" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #2a9d8f; border-radius: 5px; background: #16213e; color: #ffd700; font-size: 1rem;">
                </div>
            </div>
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                <button class="modal-btn" onclick="startCustomGame()">✅ Potvrdit</button>
                <button class="modal-btn" onclick="closeCustomModal()">❌ Zrušit</button>
            </div>
        </div>
    </div>
    
    <script>
        // Hrací proměnné
        let boardSize = 15;
        let totalMines = 50;
        let board = [];
        let gameBoard = document.getElementById('game-board');
        let minesLeftDisplay = document.getElementById('mines-left');
        let timerDisplay = document.getElementById('timer');
        let faceBtn = document.getElementById('face-btn');
        let modal = document.getElementById('modal');
        let customModal = document.getElementById('custom-modal');
        let modalTitle = document.getElementById('modal-title');
        let modalMessage = document.getElementById('modal-message');
        
        let gameStarted = false;
        let gameOver = false;
        let timerInterval = null;
        let seconds = 0;
        let flagsPlaced = 0;
        let minesLeft = totalMines;
        let waveAnimations = [];
        
        // Pirátské ikony
        const PIRATE_ICONS = {
            mine: '💣',
            flag: '🏴‍☠️',
            wrongFlag: '❌',
            ship: '⛵',
            treasure: '💰',
            cannon: '🔫',
            pirate: '☠️'
        };
        
        // Inicializace hry
        function initGame() {
            clearInterval(timerInterval);
            seconds = 0;
            flagsPlaced = 0;
            minesLeft = totalMines;
            gameStarted = false;
            gameOver = false;
            
            minesLeftDisplay.textContent = PIRATE_ICONS.cannon + ' ' + minesLeft;
            timerDisplay.textContent = '000';
            faceBtn.textContent = PIRATE_ICONS.pirate;
            
            board = [];
            gameBoard.innerHTML = '';
            gameBoard.style.gridTemplateColumns = `repeat(${boardSize}, 30px)`;
            
            // Vytvoření hracího pole
            for (let row = 0; row < boardSize; row++) {
                board[row] = [];
                for (let col = 0; col < boardSize; col++) {
                    board[row][col] = {
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        adjacentMines: 0,
                        element: null
                    };
                    
                    const cell = document.createElement('button');
                    cell.className = 'cell sea';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.style.setProperty('--wave-delay', `${Math.random() * 2}s`);
                    cell.addEventListener('click', handleCellClick);
                    cell.addEventListener('contextmenu', handleRightClick);
                    
                    gameBoard.appendChild(cell);
                    board[row][col].element = cell;
                }
            }
            
            // Umístění min (nahodně, ale ne na prvním kliknutí)
            placeMines();
            
            // Nastavení počtu sousedních min
            calculateAdjacentMines();
            
            // Nastavení vlnících se kostiček
            setupWaveAnimations();
        }
        
        // Nastavení animací vln
        function setupWaveAnimations() {
            // Případně další specifické animace
        }
        
        // Umístění min (kanónů)
        function placeMines() {
            let minesPlaced = 0;
            const positions = [];
            
            // Vytvoř seznam všech pozic
            for (let row = 0; row < boardSize; row++) {
                for (let col = 0; col < boardSize; col++) {
                    positions.push({ row, col });
                }
            }
            
            // Nahodně vyber pozice pro miny
            while (minesPlaced < totalMines && positions.length > 0) {
                const randomIndex = Math.floor(Math.random() * positions.length);
                const pos = positions.splice(randomIndex, 1)[0];
                board[pos.row][pos.col].isMine = true;
                minesPlaced++;
            }
        }
        
        // Výpočet počtu sousedních min
        function calculateAdjacentMines() {
            for (let row = 0; row < boardSize; row++) {
                for (let col = 0; col < boardSize; col++) {
                    if (board[row][col].isMine) continue;
                    
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            
                            const newRow = row + dr;
                            const newCol = col + dc;
                            
                            if (newRow >= 0 && newRow < boardSize && 
                                newCol >= 0 && newCol < boardSize && 
                                board[newRow][newCol].isMine) {
                                count++;
                            }
                        }
                    }
                    
                    board[row][col].adjacentMines = count;
                }
            }
        }
        
        // Zpracování kliknutí na buňku
        function handleCellClick(e) {
            if (gameOver) return;
            
            const row = parseInt(e.target.dataset.row);
            const col = parseInt(e.target.dataset.col);
            
            if (board[row][col].isFlagged) return;
            
            // První kliknutí - začni hru
            if (!gameStarted) {
                gameStarted = true;
                faceBtn.textContent = PIRATE_ICONS.pirate;
                startTimer();
                
                // Ujisti se, že první kliknutí není na minu
                if (board[row][col].isMine) {
                    // Najdi jinou pozici pro minu
                    for (let r = 0; r < boardSize; r++) {
                        for (let c = 0; c < boardSize; c++) {
                            if (!board[r][c].isMine && (r !== row || c !== col)) {
                                board[r][c].isMine = true;
                                board[row][col].isMine = false;
                                break;
                            }
                        }
                    }
                    calculateAdjacentMines();
                }
            }
            
            // Otevři buňku
            revealCell(row, col);
            
            // Kontrola výhry
            checkWin();
        }
        
        // Zpracování pravého kliknutí (pirátská vlajka)
        function handleRightClick(e) {
            e.preventDefault();
            if (gameOver) return;
            
            const row = parseInt(e.target.dataset.row);
            const col = parseInt(e.target.dataset.col);
            
            if (board[row][col].isRevealed) return;
            
            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }
            
            // Přepínání vlajky
            if (board[row][col].isFlagged) {
                board[row][col].isFlagged = false;
                e.target.classList.remove('flagged');
                e.target.textContent = '';
                flagsPlaced--;
                minesLeft++;
            } else {
                if (minesLeft > 0) {
                    board[row][col].isFlagged = true;
                    e.target.classList.add('flagged');
                    e.target.textContent = PIRATE_ICONS.flag;
                    flagsPlaced++;
                    minesLeft--;
                }
            }
            
            minesLeftDisplay.textContent = PIRATE_ICONS.cannon + ' ' + minesLeft;
            checkWin();
        }
        
        // Odhalení buňky
        function revealCell(row, col) {
            if (row < 0 || row >= boardSize || col < 0 || col >= boardSize) return;
            if (board[row][col].isRevealed || board[row][col].isFlagged) return;
            
            board[row][col].isRevealed = true;
            const cell = board[row][col].element;
            cell.classList.add('revealed');
            cell.classList.remove('sea');
            cell.innerHTML = '';
            
            if (board[row][col].isMine) {
                // Konec hry - výbuch
                cell.classList.add('mine', 'exploded');
                cell.innerHTML = PIRATE_ICONS.mine + '<span style="position:absolute;top:-5px;left:-5px;font-size:1.5rem;">💥</span>';
                gameOver = true;
                faceBtn.textContent = '💀';
                stopTimer();
                revealAllMines();
                showModal('Prohrál jsi!', 'Tvoje loď byla potopena kanónovou koulí! Zkus to znovu, kapitáne!');
                return;
            }
            
            if (board[row][col].adjacentMines > 0) {
                cell.textContent = board[row][col].adjacentMines;
                cell.classList.add(`number-${board[row][col].adjacentMines}`);
            } else {
                cell.classList.add('empty');
                // Odhal sousední buňky
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr !== 0 || dc !== 0) {
                            revealCell(row + dr, col + dc);
                        }
                    }
                }
            }
        }
        
        // Odhal všechny miny
        function revealAllMines() {
            for (let row = 0; row < boardSize; row++) {
                for (let col = 0; col < boardSize; col++) {
                    if (board[row][col].isMine && !board[row][col].isFlagged) {
                        board[row][col].element.classList.add('mine');
                        board[row][col].element.innerHTML = PIRATE_ICONS.mine;
                    }
                    if (!board[row][col].isMine && board[row][col].isFlagged) {
                        board[row][col].element.classList.add('flagged', 'mine');
                        board[row][col].element.innerHTML = PIRATE_ICONS.wrongFlag;
                    }
                }
            }
        }
        
        // Kontrola výhry
        function checkWin() {
            let allNonMinesRevealed = true;
            let allMinesFlagged = true;
            
            for (let row = 0; row < boardSize; row++) {
                for (let col = 0; col < boardSize; col++) {
                    if (!board[row][col].isMine && !board[row][col].isRevealed) {
                        allNonMinesRevealed = false;
                    }
                    if (board[row][col].isMine && !board[row][col].isFlagged) {
                        allMinesFlagged = false;
                    }
                }
            }
            
            if (allNonMinesRevealed || allMinesFlagged) {
                gameOver = true;
                faceBtn.textContent = '😎';
                stopTimer();
                showModal('Vyhrál jsi!', `Gratuluji, kapitáne! Všechny kanóny jsi našel za ${seconds} sekund. Tvoje loď je v bezpečí!`);
            }
        }
        
        // Spuštění časovače
        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                timerDisplay.textContent = String(seconds).padStart(3, '0');
            }, 1000);
        }
        
        // Zastavení časovače
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        // Zobrazení modálního okna
        function showModal(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.style.display = 'flex';
        }
        
        // Skryti modálního okna
        function hideModal() {
            modal.style.display = 'none';
        }
        
        // Restart hry
        function restartGame() {
            hideModal();
            initGame();
        }
        
        // Změna obtížnosti
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const difficulty = this.dataset.difficulty;
                
                if (difficulty === 'easy') {
                    boardSize = 8;
                    totalMines = 10;
                } else if (difficulty === 'medium') {
                    boardSize = 12;
                    totalMines = 30;
                } else if (difficulty === 'hard') {
                    boardSize = 15;
                    totalMines = 50;
                } else if (difficulty === 'custom') {
                    openCustomModal();
                    return;
                }
                
                // Aktualizace aktivního tlačítka
                document.querySelectorAll('.difficulty-btn').forEach(b => {
                    b.classList.remove('active');
                });
                this.classList.add('active');
                
                minesLeft = totalMines;
                minesLeftDisplay.textContent = PIRATE_ICONS.cannon + ' ' + minesLeft;
                restartGame();
            });
        });
        
        // Otevření modálního okna pro vlastní nastavení
        function openCustomModal() {
            customModal.style.display = 'flex';
        }
        
        // Zavření modálního okna pro vlastní nastavení
        function closeCustomModal() {
            customModal.style.display = 'none';
        }
        
        // Spuštění vlastní hry
        function startCustomGame() {
            const rows = parseInt(document.getElementById('custom-rows').value);
            const cols = parseInt(document.getElementById('custom-cols').value);
            const mines = parseInt(document.getElementById('custom-mines').value);
            
            if (rows < 5 || rows > 30 || cols < 5 || cols > 30) {
                alert('Počet řádků a sloupců musí být mezi 5 a 30.');
                return;
            }
            
            if (mines < 1 || mines >= rows * cols) {
                alert('Počet kanónů musí být alespoň 1 a méně než počet políček.');
                return;
            }
            
            boardSize = rows;
            totalMines = mines;
            minesLeft = totalMines;
            minesLeftDisplay.textContent = PIRATE_ICONS.cannon + ' ' + minesLeft;
            
            closeCustomModal();
            restartGame();
            
            // Aktualizace aktivního tlačítka
            document.querySelectorAll('.difficulty-btn').forEach(b => {
                b.classList.remove('active');
            });
        }
        
        // Inicializace hry při načtení stránky
        initGame();
        
        // Restart při kliknutí na pirátskou ikonu
        faceBtn.addEventListener('click', restartGame);
        
        // Zavření modálního okna při kliknutí mimo
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                hideModal();
            }
        });
        
        customModal.addEventListener('click', function(e) {
            if (e.target === customModal) {
                closeCustomModal();
            }
        });
        
        // Nastavení vlnících se kostiček pro každou buňku
        function animateWaves() {
            const cells = document.querySelectorAll('.cell:not(.revealed):not(.flagged)');
            cells.forEach((cell, index) => {
                const delay = (index % 20) * 0.1;
                cell.style.animationDelay = `${delay}s`;
            });
        }
        
        // Periodické vlnění
        setInterval(() => {
            if (!gameOver) {
                const cells = document.querySelectorAll('.cell.sea');
                cells.forEach(cell => {
                    cell.style.animation = 'none';
                    cell.offsetHeight; // Trigger reflow
                    cell.style.animation = 'seaWave 2s ease-in-out infinite';
                });
            }
        }, 5000);
    </script>
</body>
</html>
