  qs: [
    { q: 'Jaké napětí má výstup GPIO ve stavu HIGH?', a: ['3,3 V', '5 V', '1 V', '12 V'], c: 0, why: 'Raspberry Pi pracuje s logikou 3,3 V.' },
    { q: 'Senzor posílá signál 5 V. Můžeš ho připojit přímo na GPIO?', a: ['ne, potřebuješ dělič napětí nebo převodník úrovní', 'ano, bez problému', 'ano, když ho připojíš na pin 5V', 'ano, když pin v programu nastavíš jako vstup'], c: 0, why: 'GPIO nesnese víc než 3,3 V. Úroveň snížíš děličem (lekce 8).' },
    { q: 'V kódu je LED(17). Na kterém fyzickém pinu je LED?', a: ['11', '17', '6', '1'], c: 0, why: 'gpiozero používá BCM čísla. GPIO17 je fyzicky pin 11.' },
    { q: 'Proč nepřipojíš motorek přímo na GPIO?', a: ['pin dá jen pár mA, motor potřebuje stovky mA', 'motor potřebuje střídavý proud', 'GPIO má napětí 5 V', 'motor by se točil obráceně'], c: 0, why: 'Motor by pin přetížil. Motor spínej tranzistorem nebo ovladačem.' },
  ] },

{ id: 'l1-07', lvl: 1, title: 'Tlačítko a pull-up rezistor', sub: 'Jak číst vstup spolehlivě',
  idea: 'Nepřipojený vstup „plave". Pull-up nebo pull-down rezistor mu dá jasný klidový stav.',
  terms: [['Plovoucí vstup', 'Pin nepřipojený k žádnému napětí. Chytá rušení a čte náhodně 0 a 1.'], ['Pull-up rezistor', 'Rezistor ke 3,3 V. V klidu pin čte 1, stisk tlačítka proti GND dá 0.'], ['Pull-down rezistor', 'Rezistor ke GND. V klidu 0, tlačítko ke 3,3 V dá 1.'], ['Zákmity', 'Kontakty tlačítka při stisku několikrát odskočí. Program pak vidí víc stisků.']],
  body: `<p>Tlačítko jen spojuje dva kontakty. Zapojíš ho mezi GPIO a GND. Když ho pustíš, pin není připojený k ničemu. Takový vstup <b class="c">plave</b>: chytá rušení ze vzduchu i z tvé ruky a náhodně čte 0 a 1.</p>
  <p>Řešením je rezistor, který pin v klidu jemně „drží" v jednom stavu:</p>
  <ul><li><b>Pull-up</b> ke 3,3 V: v klidu 1, stisk spojí pin s GND → 0.</li><li><b>Pull-down</b> ke GND: v klidu 0, tlačítko ke 3,3 V → 1.</li></ul>
  <p>Rezistor musí být dost velký (typicky 10 kΩ), aby při stisku netekl zbytečný proud: 3,3 V / 10 kΩ = 0,33 mA. Raspberry Pi má pull-up i pull-down rezistory přímo v čipu (kolem 50 kΩ) a gpiozero pull-up zapne samo:</p>
  ${code(`from gpiozero import Button, LED
from signal import pause

tlacitko = Button(27, bounce_time=0.05)  # GPIO27 ↔ tlačítko ↔ GND
led = LED(17)
tlacitko.when_pressed = led.toggle
pause()`)}
  <p>Parametr <span class="mono">bounce_time</span> potlačí zákmity: po stisku 50 ms ignoruje další změny.</p>`,
  sim: 'pullup', task: 'Přepni na „bez rezistoru" a sleduj graf. Pak zapni pull-up a stiskni tlačítko.',
  qs: [
    { q: 'Co znamená, že vstup „plave"?', a: ['není připojený k určitému napětí a čte náhodné hodnoty', 'je připojený ke 3,3 V', 'teče jím velký proud', 'je nastavený jako výstup'], c: 0, why: 'Bez pull-up nebo pull-down rezistoru nemá pin určený klidový stav.' },
    { q: 'Pull-up rezistor a tlačítko proti GND. Co čte pin při stisku?', a: ['0', '1', 'střídavě 0 a 1', '3,3'], c: 0, why: 'Stisk spojí pin se zemí. V klidu by četl 1.' },
    { q: 'Proč pull-up rezistor nemá hodnotu 10 Ω?', a: ['při stisku by tekl zbytečně velký proud (330 mA)', 'byl by příliš slabý', 'tlačítko by vůbec nefungovalo', 'rezistor 10 Ω se nevyrábí'], c: 0, why: 'I = 3,3 / 10 = 0,33 A. S 10 kΩ je to jen 0,33 mA.' },
    { q: 'Program zaregistruje jeden stisk jako tři. Příčina?', a: ['zákmity kontaktů', 'plovoucí vstup', 'špatně zapojená LED', 'příliš nízké napětí'], c: 0, why: 'Mechanické kontakty odskakují. Pomůže bounce_time nebo kondenzátor.' },
  ] },

{ id: 'l1-08', lvl: 1, title: 'Dělič napětí', sub: 'Jak z 5 V udělat 3,3 V',
  idea: 'Dva rezistory v sérii rozdělí napětí v poměru svých odporů: U_výst = U_vst · R2 / (R1 + R2).',
  terms: [['Sériové zapojení', 'Součástky za sebou. Teče jimi stejný proud, odpory se sčítají.'], ['Dělič napětí', 'Dva rezistory v sérii. Z jejich středu odebíráš nižší napětí.'], ['Úbytek napětí', 'Část napětí, která „padne" na jedné součástce.'], ['Převodník úrovní', 'Obvod pro obousměrné rychlé signály mezi 5 V a 3,3 V.']],
  body: `<p>Když zapojíš dva rezistory za sebou, teče oběma stejný proud. Napětí se mezi ně rozdělí v poměru jejich odporů. Na větším rezistoru „padne" větší část.</p>
  <p class="formula">U_výst = U_vst · R2 / (R1 + R2)</p>
  <p>Typické použití s Raspberry Pi: ultrazvukový dálkoměr HC-SR04 vrací na pinu ECHO 5 V. S děličem R1 = 1 kΩ (nahoře) a R2 = 2 kΩ (dole) dostaneš 5 · 2 / 3 ≈ 3,3 V a GPIO je v bezpečí.</p>
  <p>Potenciometr je vlastně nastavitelný dělič: jezdec rozdělí odporovou dráhu na R1 a R2.</p>
  <div class="note limit"><h4>Na co se dělič nehodí</h4><p>Dělič je dobrý pro signály, ne pro napájení. Jakmile z jeho středu začneš odebírat proud (motor, LED pásek), napětí poklesne. Pro napájení se používá stabilizátor nebo měnič.</p></div>`,
  sim: 'divider', task: 'Nastav 5 V a hledej R1 a R2 tak, aby výstup byl mezi 3,0 a 3,3 V.',
  qs: [
    { q: 'Vstup 9 V, R1 = R2 = 10 kΩ. Jaké je výstupní napětí?', a: ['4,5 V', '9 V', '3,3 V', '18 V'], c: 0, why: 'Stejné odpory dělí napětí na poloviny.' },
    { q: 'Který dělič převede 5 V na bezpečnou úroveň pro GPIO?', a: ['R1 = 1 kΩ nahoře, R2 = 2 kΩ dole (≈ 3,3 V)', 'R1 = 2 kΩ nahoře, R2 = 1 kΩ dole', 'samotný rezistor 220 Ω', 'LED zapojená do série'], c: 0, why: 'Druhá varianta dá jen 1,7 V, to je na spolehlivou 1 málo.' },
    { q: 'Jaký je celkový odpor rezistorů 1 kΩ a 2,2 kΩ zapojených v sérii?', a: ['3,2 kΩ', '1,2 kΩ', '0,69 kΩ', '2,2 kΩ'], c: 0, why: 'V sérii se odpory sčítají.' },
    { q: 'Proč z děliče nenapájet motor?', a: ['při odběru proudu výstupní napětí poklesne', 'dělič dává střídavé napětí', 'motor potřebuje přesně 3,3 V', 'rezistory by se zkratovaly'], c: 0, why: 'Zátěž je paralelně k R2 a mění poměr děliče.' },
  ] },

{ id: 'l1-09', lvl: 1, title: 'Tranzistor jako spínač', sub: 'Malý proud ovládá velký',
  idea: 'Malý proud z GPIO do báze otevře tranzistor a ten spíná velký proud do zátěže.',
  terms: [['Tranzistor NPN', 'Součástka se třemi vývody: báze (B), kolektor (C), emitor (E).'], ['Bázový rezistor', 'Omezuje proud z GPIO do báze. Typicky 1 kΩ.'], ['Zesilovací činitel β (h_FE)', 'Kolikrát větší proud může téct kolektorem než bází. Obvykle 100 až 400.'], ['Nasycení', 'Tranzistor je plně sepnutý a hřeje se jen málo.'], ['Spínání na straně GND', 'Zátěž je mezi + a kolektorem, emitor je na zemi.']],
  body: `<p>GPIO dá jen pár miliampérů. Motor, relé nebo LED pásek potřebují stovky. Pomůže <b class="c">tranzistor</b>: ventil, který malým proudem otevíráš pro velký proud.</p>
  <p>Zapojení: zátěž mezi +5 V a kolektor, emitor na GND, báze přes rezistor 1 kΩ na GPIO. Když je GPIO HIGH, teče do báze proud</p>
  <p class="formula">I_B = (3,3 − 0,7) / 1 000 ≈ 2,6 mA</p>
  <p>(0,7 V „spolkne" přechod báze–emitor). S β ≈ 100 může kolektorem téct až 260 mA. Aby byl tranzistor plně sepnutý, dávej do báze proud s rezervou, aspoň dvakrát víc, než by stačilo podle β. Jinak zůstane napůl otevřený a hřeje se.</p>
  <p>Běžné malé tranzistory (BC337, 2N2222) spínají do asi 500 mA. Na větší proudy se používá MOSFET (úroveň 3). Motor a relé potřebují navíc ochrannou diodu (úroveň 2, lekce Relé).</p>
  <div class="note"><h4>Pořadí vývodů</h4><p>Pořadí C–B–E se u různých tranzistorů liší (BC547: C, B, E; 2N2222: E, B, C). Vždy si ho ověř v katalogovém listu (datasheetu).</p></div>`,
  sim: 'tswitch', task: 'Zvol zátěž motorek. Najdi bázový rezistor, se kterým je tranzistor plně sepnutý a GPIO přitom nepřetížíš.',
  qs: [
    { q: 'Který vývod NPN tranzistoru připojíš přes rezistor na GPIO?', a: ['bázi', 'kolektor', 'emitor', 'žádný, GPIO patří na zátěž'], c: 0, why: 'Báze je řídicí vývod.' },
    { q: 'GPIO 3,3 V, bázový rezistor 1 kΩ. Jaký je bázový proud?', a: ['asi 2,6 mA', '3,3 A', '33 mA', '0,7 mA'], c: 0, why: '(3,3 − 0,7) / 1 000 = 2,6 mA.' },
    { q: 'β = 100, bázový proud 2 mA. Kolik nejvýš může téct kolektorem?', a: ['200 mA', '2 mA', '20 mA', '102 mA'], c: 0, why: 'I_C = β · I_B = 100 · 2 mA.' },
    { q: 'Proč nepoužít bázový rezistor 10 Ω?', a: ['bázový proud by přetížil GPIO', 'tranzistor by nesepnul', 'motor by se točil pomaleji', 'rezistor by shořel jako první'], c: 0, why: 'I_B ≈ 2,6 V / 10 Ω = 260 mA, to GPIO zničí.' },
  ] },

{ id: 'l1-10', lvl: 1, title: 'Napájení a baterie', sub: 'Kolik proudu a na jak dlouho',
  idea: 'Zdroj musí dodat dost proudu. Výdrž baterie ≈ kapacita (mAh) / odběr (mA).',
  terms: [['Napájecí zdroj', 'Raspberry Pi 4 potřebuje 5 V / 3 A přes USB-C, Pi 5 oficiálně 5 V / 5 A.'], ['Kapacita (mAh)', 'Kolik proudu baterie dodá za hodinu. 1 000 mAh = 1 A po dobu jedné hodiny.'], ['Výkon P = U · I', 'Ve wattech (W). 5 V · 3 A = 15 W.'], ['Podpětí', 'Zdroj nestíhá, napětí klesá. Raspberry Pi hlásí varování a může se restartovat.']],
  body: `<p>Každý zdroj má dvě důležitá čísla: <b class="c">napětí</b> (musí sedět, pro Raspberry Pi 5 V) a <b class="c">maximální proud</b> (musí stačit). Slabý adaptér nebo tenký dlouhý kabel způsobí <b>podpětí</b>: Raspberry Pi zpomalí, hlásí varování a může se náhodně restartovat.</p>
  <p>Motory a LED pásky napájej z vlastního zdroje, ne z pinu 5V na Raspberry Pi. Země obou zdrojů propoj.</p>
  <p>U baterií a powerbank se kapacita udává v mAh. Hrubý odhad výdrže:</p>
  <p class="formula">t [h] ≈ kapacita [mAh] / odběr [mA]</p>
  <p>Ve skutečnosti vydrží méně, obvykle 70–80 % výpočtu: napětí se převádí (3,7 V článek → 5 V) a část energie se ztratí jako teplo.</p>`,
  sim: 'battery', task: 'Kolik hodin vydrží Raspberry Pi 4 v klidu na powerbance 10 000 mAh? A kolik při plné zátěži?',
  qs: [
    { q: 'Powerbanka 5 000 mAh, odběr 500 mA, bez ztrát. Výdrž?', a: ['10 h', '2,5 h', '100 h', '1 h'], c: 0, why: '5 000 / 500 = 10 hodin.' },
    { q: 'Raspberry Pi se náhodně restartuje a hlásí podpětí. Nejpravděpodobnější příčina?', a: ['slabý adaptér nebo tenký kabel', 'chybný program', 'příliš studená místnost', 'příliš velká SD karta'], c: 0, why: 'Zdroj nedodá dost proudu a napětí poklesne.' },
    { q: 'Jaký výkon odebírá zařízení na 5 V při proudu 2 A?', a: ['10 W', '2,5 W', '7 W', '3 W'], c: 0, why: 'P = U · I = 5 · 2 = 10 W.' },
    { q: 'Motor má vlastní zdroj. Co musí být propojené s Raspberry Pi?', a: ['GND', 'pin 5V', 'pin 3V3', 'nic'], c: 0, why: 'Společná zem je podmínkou, aby signál z GPIO fungoval.' },
  ] },

/* ---------- ÚROVEŇ 2 ---------- */
{ id: 'l2-01', lvl: 2, title: 'Druhy rezistorů a výkon', sub: 'Teplo, materiály a normalizované řady',
  idea: 'Rezistor mění energii v teplo P = U · I. Vybírej takový, který snese aspoň dvojnásobek.',
  terms: [['Výkon P (watt, W)', 'P = U · I = I² · R = U² / R. Tolik tepla na rezistoru vzniká.'], ['Drátový rezistor', 'Odporový drát na keramice. Velké výkony, nehodí se pro vysoké frekvence.'], ['Metalizovaný rezistor', 'Tenká kovová vrstva. Přesný (±1 %) a teplotně stabilní.'], ['Termistor NTC', 'Odpor klesá s teplotou. Používá se jako teploměr.'], ['Řada E24', 'Normalizované hodnoty pro tolerance ±5 %: 10, 11, 12, 13, 15, 16, 18, 20, 22…']],
  body: `<p>Rezistory se liší materiálem:</p>
  <ul><li><b>Drátový</b>: odporový drát (nikl-chrom) navinutý na keramice. Snese velký výkon, ale navinutý drát se chová i jako cívka.</li>
  <li><b>Uhlíkový hmotový</b>: uhlíkový prášek s pryskyřicí vypálený v peci. Při přetížení trvale změní hodnotu. Dnes spíš historie.</li>
  <li><b>Uhlíkový vrstvový</b>: tenká vrstva uhlíku na keramické tyčince, spirálovitě prořezaná. Levný, nejběžnější béžový rezistor.</li>
  <li><b>Metalizovaný</b>: místo uhlíku kovová slitina. Přesnější, stabilnější, méně šumí. Obvykle modrý s pěti pruhy.</li>
  <li><b>Nelineární</b>: termistor (teplota), fotorezistor (světlo), varistor (napětí, ochrana proti přepětí).</li></ul>
  <p>Rezistory se dřív vyrobily a pak roztřídily. Tak vznikly <b class="c">normalizované řady</b>: v řadě E24 jsou sousední hodnoty asi 10 % od sebe, takže se jejich tolerance ±5 % dotýkají.</p>
  <p>Kolik tepla rezistor snese, závisí hlavně na jeho <b>velikosti</b>: 1/8 W (3,5 mm), 1/4 W (6 mm), 1/2 W (9 mm). Rezistor pro LED z GPIO (220 Ω, 6 mA) má jen P = 0,006² · 220 ≈ 8 mW. Rezistor 10 Ω na 5 V už 2,5 W a potřebuje 5W typ.</p>`,
  sim: 'power', task: 'Jaký výkon vzniká na rezistoru 47 Ω připojeném na 12 V? Jaký typ zvolíš?',
  qs: [
    { q: 'Rezistorem 100 Ω teče 0,1 A. Jaký výkon se mění v teplo?', a: ['1 W', '10 W', '0,01 W', '100 W'], c: 0, why: 'P = I² · R = 0,01 · 100 = 1 W.' },
    { q: 'Který typ rezistoru je nejpřesnější a nejstabilnější?', a: ['metalizovaný', 'uhlíkový hmotový', 'uhlíkový vrstvový', 'fotorezistor'], c: 0, why: 'Kovová vrstva je stabilní a vyrábí se s tolerancí 1 % i menší.' },
    { q: 'Termistor NTC mění odpor podle:', a: ['teploty', 'světla', 'napětí', 'frekvence'], c: 0, why: 'NTC = Negative Temperature Coefficient: s teplotou odpor klesá.' },
    { q: 'Co hlavně určuje, jaký výkon rezistor snese?', a: ['jeho velikost', 'barva pruhů', 'hodnota odporu', 'tolerance'], c: 0, why: 'Větší těleso lépe odvádí teplo do okolí.' },
  ] },

{ id: 'l2-02', lvl: 2, title: 'Kondenzátor: membrána v trubce', sub: 'Nabíjení, vybíjení a časová konstanta',
  idea: 'Kondenzátor se nabije na napětí zdroje a pak proud zastaví. Stejnosměrný proud neprojde.',
  terms: [['Kondenzátor', 'Dvě vodivé desky oddělené izolantem. Uchovává náboj.'], ['Kapacita C (farad, F)', 'Kolik náboje pojme. Prakticky µF, nF a pF.'], ['Dielektrikum', 'Izolant mezi deskami (vzduch, keramika, plast, oxid).'], ['Časová konstanta τ = R · C', 'Za čas τ se kondenzátor nabije na 63 %, za 5τ prakticky úplně.'], ['Přechodový proud', 'Krátký proud, který teče jen během nabíjení nebo vybíjení.']],
  body: `<p>Představ si trubku přepaženou pružnou gumovou <b>membránou</b>. Když na jednom konci zatlačíš pístem, voda napne membránu. Voda na druhé straně se posune, takže chvíli teče proud. Jakmile membrána tlačí zpět stejně silně jako píst, všechno se zastaví. Trubka je <b class="c">nabitá</b>. Když píst pustíš, membrána vodu vrátí a trubka se <b class="c">vybije</b>.</p>
  <p>Kondenzátor se chová stejně. Po připojení ke zdroji se na jedné desce hromadí elektrony, dokud napětí kondenzátoru nevyrovná napětí zdroje. Pak proud přestane téct. Stejnosměrný proud tedy trvale <b>neprojde</b>, teče jen krátký přechodový proud.</p>
  <p>Jak rychle se nabije, určuje rezistor v cestě: <span class="mono">τ = R · C</span>. S 10 kΩ a 100 µF je τ = 1 s.</p>
  <p>Kde kondenzátory potkáš: 100nF kondenzátor u každého čipu vyhlazuje napájení, velké elektrolyty v zdrojích, v časovačích a v bleskách fotoaparátů.</p>
  <div class="note limit"><h4>Pozor</h4><p>Velké kondenzátory drží náboj i po vypnutí přístroje. V síťových zdrojích může zůstat nebezpečné napětí.</p></div>`,
  sim: 'rc', task: 'Připoj zdroj a sleduj proud. Pak zvětši C a zopakuj. Za jak dlouho je kondenzátor „plný"?',
  qs: [
    { q: 'Co se stane s proudem, když se kondenzátor nabije na napětí zdroje?', a: ['klesne na nulu', 'vzroste na maximum', 'začne střídat směr', 'zůstane stejný'], c: 0, why: 'Napětí kondenzátoru vyrovná zdroj a proud už nemá co tlačit.' },
    { q: 'Jak se jmenuje izolant mezi deskami kondenzátoru?', a: ['dielektrikum', 'elektroda', 'anoda', 'vodič'], c: 0, why: 'V analogii je to gumová membrána.' },
    { q: 'R = 10 kΩ, C = 100 µF. Jaká je časová konstanta τ?', a: ['1 s', '0,1 s', '10 s', '1 ms'], c: 0, why: 'τ = 10 000 · 0,000 1 = 1 s.' },
    { q: 'Kondenzátorem stejnosměrný proud trvale:', a: ['neprochází', 'prochází bez omezení', 'prochází jen s rezistorem', 'prochází jen u elektrolytů'], c: 0, why: 'Teče jen krátký nabíjecí proud.' },
  ] },

{ id: 'l2-03', lvl: 2, title: 'Stavba kondenzátoru a kapacita', sub: 'Plocha, vzdálenost, dielektrikum',
  idea: 'Kapacita roste s plochou desek a permitivitou dielektrika, klesá se vzdáleností desek.',
  terms: [['Permitivita εr', 'Kolikrát dielektrikum zvýší kapacitu oproti vakuu. Vzduch 1, sklo asi 10, voda 81.'], ['Průrazné napětí', 'Napětí, při kterém dielektrikum „prorazí" a kondenzátor se zničí.'], ['Součin C · U', 'Čím větší kapacita a napětí, tím větší kondenzátor.'], ['Ladicí kondenzátor', 'Otočné desky se zasouvají mezi pevné. Kapacita se mění otáčením.']],
  body: `<p>Každý kondenzátor má dvě (nebo více) vodivé desky a mezi nimi dielektrikum. Kapacitu určují tři věci:</p>
  <ol><li>větší <b>plocha</b> desek → větší kapacita,</li><li>větší <b>vzdálenost</b> desek → menší kapacita,</li><li>větší <b>permitivita</b> dielektrika → větší kapacita.</li></ol>
  <p class="formula">C = ε₀ · εr · A · (N − 1) / d</p>
  <p>(ε₀ = 8,85 · 10⁻¹² F/m, A je plocha jedné desky, d vzdálenost, N počet desek.)</p>
  <p>V analogii s membránou: měkká guma se hodně vydme a pojme hodně vody, ale snadno praskne (velká kapacita, nízké napětí). Tuhá guma vydrží velký tlak, ale pojme málo. Chceš-li obojí, potřebuješ větší trubku. Proto kondenzátor s velkým C i U je velký.</p>
  <p>Jediné dielektrikum, ve kterém se neztrácí žádná energie, je dokonalé vakuum. U ladicího kondenzátoru je dielektrikem vzduch; největší kapacitu má, když jsou otočné desky celé zasunuté mezi pevné.</p>
  <div class="tscroll"><table><thead><tr><th>Materiál</th><th>εr</th></tr></thead><tbody><tr><td>vzduch</td><td class="num">1</td></tr><tr><td>papír</td><td class="num">1,5–3</td></tr><tr><td>parafín</td><td class="num">2,25</td></tr><tr><td>porcelán</td><td class="num">4,4</td></tr><tr><td>slída</td><td class="num">7,5</td></tr><tr><td>sklo</td><td class="num">≈ 10</td></tr><tr><td>destilovaná voda</td><td class="num">81</td></tr></tbody></table></div>`,
  sim: 'capcalc', task: 'Nastav sklo a desky 25 × 25 mm vzdálené 0,25 mm. Pak desky přibliž na polovinu. Kolikrát vzrostla kapacita?',
  qs: [
    { q: 'Desky přiblížíš na poloviční vzdálenost. Kapacita:', a: ['se zdvojnásobí', 'klesne na polovinu', 'se nezmění', 'vzroste čtyřikrát'], c: 0, why: 'C je nepřímo úměrná vzdálenosti d.' },
    { q: 'Vzduch mezi deskami nahradíš destilovanou vodou (εr = 81). Kapacita:', a: ['vzroste 81krát', 'se nezmění', 'klesne', 'klesne na polovinu'], c: 0, why: 'C je přímo úměrná εr.' },
    { q: 'Které dielektrikum pracuje úplně bez ztrát energie?', a: ['dokonalé vakuum', 'vzduch', 'sklo', 'slída'], c: 0, why: 'Každý skutečný materiál část energie ztrácí.' },
    { q: 'Ladicí kondenzátor má největší kapacitu, když jsou otočné desky:', a: ['celé zasunuté mezi pevné', 'úplně vysunuté', 'zasunuté napůl', 'na poloze nezáleží'], c: 0, why: 'Zasunutím roste plocha, kde se desky překrývají.' },
  ] },

{ id: 'l2-04', lvl: 2, title: 'Značení kondenzátorů a polarita', sub: 'Kódy 104, 4n7 a pruh s minusem',
  idea: 'Kód 104 znamená 10 · 10⁴ pF = 100 nF. Elektrolyt má polaritu: pruh s minusem patří k nižšímu napětí.',
  terms: [['pF, nF, µF', '1 µF = 1 000 nF = 1 000 000 pF.'], ['Trojčíselný kód', 'Dvě číslice a počet nul, v pikofaradech. 473 = 47 000 pF = 47 nF.'], ['Tolerance J / K / M', '±5 %, ±10 %, ±20 %. Z znamená +80 / −20 %.'], ['Jmenovité napětí', 'Nejvyšší napětí, které kondenzátor trvale vydrží. Vol ho s rezervou.'], ['Elektrolytický kondenzátor', 'Velká kapacita v malém objemu, ale má polaritu.']],
  body: `<p>Malé keramické kondenzátory nesou krátký kód. Tři číslice: první dvě jsou hodnota, třetí počet nul, vše v <b>pikofaradech</b>:</p>
  <ul><li>104 = 10 + 0000 pF = 100 000 pF = <b>100 nF</b> (nejběžnější „blokovací" kondenzátor),</li><li>472 = 4 700 pF = 4,7 nF,</li><li>4n7 nebo 2R2: písmeno stojí místo desetinné čárky (4,7 nF; 2,2).</li></ul>
  <p>Písmeno na konci je tolerance (473<b>J</b> = ±5 %). Někteří výrobci ale píšou hodnotu přímo: malý kotouček s nápisem 100 bývá 100 pF, velký elektrolyt s nápisem 100 je 100 µF. Pomáhá velikost součástky.</p>
  <p><b class="c">Elektrolytické</b> (a tantalové) kondenzátory mají polaritu. Delší nožička je +, pruh s minusy na pouzdře je −. Obráceně zapojený elektrolyt se zahřívá, nafoukne a může prasknout.</p>
  <p>Jmenovité napětí vol aspoň o polovinu vyšší než napětí v obvodu: pro 5 V stačí 10 V, pro 12 V volíme 25 V.</p>`,
  sim: 'capcode', task: 'Rozlušti kódy 104, 473J, 4n7 a napěťový kód 1H.',
  qs: [
    { q: 'Keramický kondenzátor s kódem 104 má kapacitu:', a: ['100 nF', '104 pF', '10 µF', '1 nF'], c: 0, why: '10 a čtyři nuly = 100 000 pF = 100 nF.' },
    { q: 'Kód 472 znamená:', a: ['4,7 nF', '472 pF', '47 nF', '4,7 µF'], c: 0, why: '47 a dvě nuly = 4 700 pF = 4,7 nF.' },
    { q: 'Pruh s minusy na elektrolytu označuje:', a: ['záporný vývod', 'kladný vývod', 'tepelnou pojistku', 'jmenovité napětí'], c: 0, why: 'Tento vývod musí mít nižší napětí než druhý.' },
    { q: 'Obvod pracuje s 12 V. Jaký elektrolyt zvolíš?', a: ['25 V', '10 V', '6,3 V', 'přesně 12 V'], c: 0, why: 'Napětí se volí s rezervou. 10 V a 6,3 V by prorazily.' },
    { q: 'Kondenzátory 10 µF a 20 µF spojíš paralelně. Výsledná kapacita?', a: ['30 µF', '6,7 µF', '10 µF', '200 µF'], c: 0, why: 'Paralelně se plochy desek sčítají, jako by trubka byla širší.' },
  ] },

{ id: 'l2-05', lvl: 2, title: 'Cívka: elektrická setrvačnost', sub: 'Proud, který se nechce zastavit',
  idea: 'Proud cívkou se nemůže změnit skokem. Když ho náhle přerušíš, cívka vyrobí napěťovou špičku.',
  terms: [['Cívka (induktor, tlumivka)', 'Navinutý drát. Proud v ní vytváří magnetické pole.'], ['Indukčnost L (henry, H)', 'Jak velkou „setrvačnost" cívka má. Prakticky mH a µH.'], ['Časová konstanta τ = L / R', 'Za τ proud vzroste na 63 % konečné hodnoty.'], ['Napěťová špička', 'Vysoké napětí, které cívka vyrobí při rychlém přerušení proudu.'], ['Duální součástky', 'Kondenzátor a cívka se chovají „zrcadlově".']],
  body: `<p>Představ si velmi dlouhou hadici stočenou do klubka. Je v ní hodně vody. Když na jednom konci zatlačíš, voda se nerozběhne hned: má <b>setrvačnost</b>. Rozjíždí se postupně, až teče plnou rychlostí.</p>
  <p>Když se ji pak pokusíš zastavit najednou, voda se valí dál a vznikne obrovský tlakový ráz. V cívce je to <b class="c">napěťová špička</b>: desítky až stovky voltů, i když zdroj měl jen 9 V. Takto funguje i zapalovací cívka v autě.</p>
  <p>Cívka proto propouští stejnosměrný proud (po rozběhu ho brzdí jen odpor drátu), ale brání rychlým změnám a střídavému proudu. Je to přesný opak kondenzátoru.</p>
  <p>Energii cívka ukládá v magnetickém poli, kondenzátor v elektrickém. Cívky najdeš v relé, motorech, transformátorech, filtrech a v měničích napětí.</p>`,
  sim: 'rl', task: 'Zapni proud a počkej, až se ustálí. Pak spínač rozepni a sleduj napětí na cívce.',
  qs: [
    { q: 'Cívku nejlépe popisuje:', a: ['elektrická setrvačnost', 'elektrické tření', 'zásobník náboje', 'zpětný ventil'], c: 0, why: 'Proud v cívce se nechce rozběhnout ani zastavit.' },
    { q: 'Po připojení ke zdroji proud cívkou:', a: ['roste postupně', 'skočí okamžitě na maximum', 'krátce teče a pak klesne na nulu', 'neteče vůbec'], c: 0, why: 'Klesající proud na nulu je chování kondenzátoru.' },
    { q: 'Co způsobí náhlé přerušení proudu cívkou?', a: ['napěťovou špičku', 'okamžitý pokles napětí na nulu', 'zkrat zdroje', 'nic zvláštního'], c: 0, why: 'Cívka se snaží udržet proud a vyrobí k tomu vysoké napětí.' },
    { q: 'Kondenzátor blokuje stejnosměrný proud. Cívka brání:', a: ['rychlým změnám a střídavému proudu', 'stejnosměrnému proudu', 'napětí', 'ničemu'], c: 0, why: 'Proto se jim říká duální součástky.' },
    { q: 'Energii cívka ukládá:', a: ['v magnetickém poli', 'v elektrickém poli', 'v dielektriku', 'v teple drátu'], c: 0, why: 'Kondenzátor ukládá energii v elektrickém poli.' },
  ] },

{ id: 'l2-06', lvl: 2, title: 'Dioda: zpětný ventil', sub: 'Proud jen jedním směrem',
  idea: 'Dioda vede jen jedním směrem a otevře se až nad prahovým napětím (křemík asi 0,7 V).',
  terms: [['Anoda a katoda', 'Proud teče z anody do katody. Katodu označuje proužek.'], ['Propustný / závěrný směr', 'V propustném dioda vede, v závěrném ne.'], ['Prahové napětí', 'Křemík 0,6–0,7 V, Schottkyho dioda asi 0,3 V, LED 1,8–3,3 V.'], ['Zenerova dioda', 'V závěrném směru při určitém napětí (např. 5,1 V) vede a drží ho stálé.'], ['VA charakteristika', 'Graf proudu v závislosti na napětí.']],
  body: `<p>Dioda je jako <b class="c">zpětný ventil</b> s pružinou. Voda jím proteče jen jedním směrem, a to až když tlak přemůže pružinu. Opačným směrem ventil zavře doraz.</p>
  <p>U křemíkové diody „pružina" odpovídá asi 0,7 V. Pod touto hranicí proud prakticky neteče, nad ní prudce roste. Proto s diodou (a LED) vždy počítáme s omezením proudu.</p>
  <p>Dioda z galium-arsenidu potřebuje asi dvojnásobné napětí a energie uvolněná na přechodu se mění ve světlo. To je <b>LED</b>. Barva závisí na materiálu: červená asi 1,8–2 V, modrá a bílá asi 3 V.</p>
  <p><b>Zenerova dioda</b> se zapojuje obráceně. Při dosažení svého Zenerova napětí začne vést a napětí na ní zůstane stálé. Slouží jako reference nebo ochrana proti přepětí.</p>
  <p>K čemu diody jsou: usměrňovač (ze střídavého proudu stejnosměrný), ochrana proti přepólování baterie, ochrana tranzistoru u relé. Běžné typy: 1N4148 (signálová), 1N4007 (usměrňovací, 1 A).</p>`,
  sim: 'diode', task: 'Pomalu zvyšuj napětí na křemíkové diodě. Kdy začne téct proud? Porovnej s modrou LED a Zenerovou diodou v závěrném směru.',
  qs: [
    { q: 'Křemíková dioda začne znatelně vést asi při:', a: ['0,7 V', '7 V', '0,07 V', '3,3 V'], c: 0, why: 'Typický práh křemíkového PN přechodu.' },
    { q: 'Proužek na pouzdře diody označuje:', a: ['katodu', 'anodu', 'výrobce', 'maximální proud'], c: 0, why: 'Katoda je konec, kterým proud z diody vytéká.' },
    { q: 'Zenerova dioda se obvykle zapojuje:', a: ['v závěrném směru jako zdroj stálého napětí', 'v propustném směru jako LED', 'místo pojistky do série', 'paralelně k LED'], c: 0, why: 'Využívá se řízený průraz v závěrném směru.' },
    { q: 'Proč modrá LED potřebuje vyšší napětí než červená?', a: ['modré světlo má vyšší energii, materiál má vyšší práh', 'má jiné pouzdro', 'modrá barva pohlcuje světlo', 'je větší'], c: 0, why: 'Energie fotonu odpovídá energii potřebné k přechodu elektronu.' },
  ] },

{ id: 'l2-07', lvl: 2, title: 'Tranzistor: NPN, PNP a zesílení', sub: 'Páka, která otevírá ventil',
  idea: 'Tranzistor je proudem řízený ventil: I_C = β · I_B a I_E = I_B + I_C.',
  terms: [['Zesilovací činitel β', 'Poměr I_C / I_B. Liší se kus od kusu, typicky 100–400.'], ['Aktivní režim', 'Tranzistor zesiluje: I_C roste úměrně I_B.'], ['Nasycení', 'Plně sepnuto. Větší I_B už proud nezvětší.'], ['Závěr', 'Zavřeno: bez proudu báze neteče ani kolektorem.'], ['NPN a PNP', 'U PNP tečou proudy opačně a emitor bývá připojen k +.']],
  body: `<p>Představ si páku. Slabý proud báze tlačí na její dlouhé rameno. Krátké rameno otevírá ventil ve velké trubce kolektoru. Poměr ramen odpovídá <b class="c">β</b>: když je dlouhé rameno 100× delší, kolektorem proteče 100× víc než bází. Oba proudy nakonec odtékají emitorem:</p>
  <p class="formula">I_C = β · I_B     I_E = I_B + I_C</p>
  <p>Tranzistor má tři režimy. <b>Závěr</b>: báze bez proudu, tranzistor zavřený. <b>Aktivní režim</b>: zesiluje, I_C sleduje I_B. <b>Nasycení</b>: ventil je otevřený naplno a víc proudu nepustí, protože ho omezuje zátěž. Při spínání (lekce 9 úrovně 1) chceme nasycení, při zesilování zvuku aktivní režim.</p>
  <p><b>PNP</b> tranzistor funguje obráceně: proud vtéká emitorem a vytéká bází a kolektorem. Emitor PNP se proto připojuje k + zdroje, emitor NPN k zemi. Šipka ve značce ukazuje směr proudu emitorem. Pomůcka: <em>PNP = „Pointing iN"</em>, šipka míří dovnitř.</p>
  <p>β se liší i u tranzistorů stejného typu. Dobře navržený obvod na přesné hodnotě β nezávisí.</p>`,
  sim: 'beta', task: 'Zvyšuj bázový proud a sleduj, kdy lampa přestane jasnět. Jak se tomu stavu říká?',
  qs: [
    { q: 'β = 200, I_B = 0,1 mA. Jaký je I_C v aktivním režimu?', a: ['20 mA', '2 mA', '200 mA', '0,5 mA'], c: 0, why: 'I_C = 200 · 0,1 mA.' },
    { q: 'I_B = 1 mA, I_C = 99 mA. Jaký je proud emitorem?', a: ['100 mA', '98 mA', '99 mA', '1 mA'], c: 0, why: 'I_E = I_B + I_C.' },
    { q: 'Šipka v symbolu tranzistoru míří dovnitř, k bázi. Jde o:', a: ['PNP', 'NPN', 'MOSFET', 'diodu'], c: 0, why: 'PNP = Pointing iN.' },
    { q: 'Tranzistor v nasycení:', a: ['je plně sepnutý a větší I_B už proud nezvětší', 'zesiluje', 'je zavřený', 'se přehřívá'], c: 0, why: 'Proud omezuje zátěž, ne tranzistor.' },
  ] },

{ id: 'l2-08', lvl: 2, title: 'PWM: stmívání bez ztrát', sub: 'Rychlé zapínání a vypínání',
  idea: 'PWM rychle zapíná a vypíná. Střída, tedy podíl času „zapnuto", určuje průměrný výkon.',
  terms: [['PWM', 'Pulzně šířková modulace: obdélníkový signál s nastavitelnou šířkou pulzu.'], ['Frekvence', 'Kolik period za sekundu (Hz). Pro LED stačí stovky Hz.'], ['Střída (duty cycle)', 'Kolik procent periody je signál zapnutý.'], ['Průměrné napětí', 'U_průměr = střída · U. Při 25 % a 3,3 V asi 0,83 V.']],
  body: `<p>GPIO umí jen 0 V nebo 3,3 V. Jak tedy LED ztlumit na polovinu? Budeme ji <b class="c">rychle zapínat a vypínat</b>. Když svítí polovinu času, vypadá poloviční. Oko (i motor) má setrvačnost a vnímá jen průměr.</p>
  <p class="formula">U_průměr = střída · U</p>
  <p>Při nízké frekvenci (1–10 Hz) vidíš blikání. Nad zhruba 100 Hz oko blikání nerozliší. Motor PWM „vyhladí" svou setrvačností.</p>
  <p>Proč ne rezistorem? Rezistor by přebytečnou energii měnil v teplo. Spínač při PWM je buď plně sepnutý, nebo plně rozepnutý, a v obou stavech se téměř nehřeje. Proto PWM řídí motory, ventilátory i jas displejů.</p>
  ${code(`from gpiozero import PWMLED
from signal import pause

led = PWMLED(18)
led.value = 0.25   # střída 25 %
led.pulse()        # plynulé „dýchání"
pause()`)}
  <p>Hardwarové PWM má Raspberry Pi na GPIO12, 13, 18 a 19. Servomotory používají PWM 50 Hz s pulzem 1–2 ms.</p>`,
  sim: 'pwm', task: 'Nastav 2 Hz a střídu 25 %. Pak zvyšuj frekvenci, dokud LED nepřestane blikat.',
  qs: [
    { q: 'Střída 40 % při napájení 5 V. Jaké je průměrné napětí?', a: ['2 V', '5 V', '0,4 V', '3 V'], c: 0, why: '0,4 · 5 = 2 V.' },
    { q: 'Proč LED řízená PWM s frekvencí 500 Hz nebliká?', a: ['oko nestihne vnímat tak rychlé změny', 'LED se nestihne vypnout', 'při 500 Hz teče stejnosměrný proud', 'rezistor blikání vyhladí'], c: 0, why: 'Zrak vnímá jen průměrný jas.' },
    { q: 'Proč je PWM úspornější než stmívání rezistorem?', a: ['spínač je buď plně zapnutý, nebo vypnutý, a skoro nehřeje', 'PWM zvyšuje napětí', 'LED při PWM potřebuje méně energie na světlo', 'rezistor nelze použít'], c: 0, why: 'Rezistor by přebytek výkonu měnil v teplo.' },
    { q: 'Který objekt gpiozero použiješ pro stmívání LED?', a: ['PWMLED', 'Button', 'LED', 'DistanceSensor'], c: 0, why: 'PWMLED má vlastnost value od 0 do 1.' },
  ] },

{ id: 'l2-09', lvl: 2, title: 'Relé a ochranná dioda', sub: 'Spínač ovládaný cívkou',
  idea: 'Relé je spínač ovládaný cívkou. Paralelně k cívce vždy zapoj diodu, jinak špička zničí tranzistor.',
  terms: [['Relé', 'Elektromagnet přitahuje kontakty. Ovládací a spínaný obvod jsou oddělené.'], ['COM, NO, NC', 'Společný kontakt, v klidu rozpojený (NO) a v klidu spojený (NC).'], ['Ochranná dioda', 'Dioda paralelně k cívce, katodou k +. Tlumí špičku při vypnutí.'], ['Galvanické oddělení', 'Obvody nejsou vodivě spojené; ovlivňují se jen magneticky nebo světlem.']],
  body: `<p>Relé má uvnitř <b>cívku</b> a pohyblivé kontakty. Proud cívkou vytvoří magnetické pole, které kontakty přitáhne. Malý proud tak spíná obvod, který je od Raspberry Pi úplně oddělený: lampu, čerpadlo nebo motor.</p>
  <p>Cívka ale má setrvačnost (lekce Cívka). Když ji tranzistor vypne, vznikne na kolektoru <b class="c">napěťová špička</b> desítek až stovek voltů. Malý tranzistor ji nemusí přežít.</p>
  <p>Řešením je <b>ochranná dioda</b> paralelně k cívce, zapojená katodou k +. Za běžného provozu nevede. Po vypnutí převezme proud cívky, ten pomalu doběhne v kroužku cívka–dioda a špička nevznikne. Totéž platí pro motory a elektromagnetické ventily.</p>
  <p>Hotové moduly relé pro Raspberry Pi mají tranzistor, diodu i kontrolku už na desce. Některé přidávají optočlen pro úplné oddělení.</p>
  <div class="note limit"><h4>Síťové napětí</h4><p>Relé zvládne spínat 230 V, ale práce se síťovým napětím je životu nebezpečná. Jako začátečník spínej jen bezpečná nízká napětí.</p></div>`,
  sim: 'relay', task: 'Rozepni spínač bez diody a pak s diodou. Porovnej velikost špičky.',
  qs: [
    { q: 'Jak se zapojuje ochranná dioda k cívce relé?', a: ['paralelně k cívce, katodou k +', 'do série s cívkou', 'paralelně, katodou k GND', 'mezi bázi a emitor'], c: 0, why: 'Za provozu je v závěrném směru; po vypnutí umožní proudu doběhnout.' },
    { q: 'Co se stane bez diody při vypnutí relé?', a: ['vznikne napěťová špička, která může zničit tranzistor', 'relé zůstane sepnuté', 'nic', 'Raspberry Pi se restartuje'], c: 0, why: 'Cívka se brání změně proudu a vyrobí vysoké napětí.' },
    { q: 'Kontakt NO znamená:', a: ['v klidu rozpojený, při aktivaci sepne', 'v klidu sepnutý', 'bez funkce', 'vždy spojený s cívkou'], c: 0, why: 'NO = normally open.' },
    { q: 'Proč použít relé místo tranzistoru?', a: ['oddělí ovládání od silového obvodu a spíná i střídavé napětí', 'je rychlejší', 'je menší', 'nepotřebuje napájení'], c: 0, why: 'Tranzistor spíná jen stejnosměrný proud a obvody nejsou oddělené.' },
  ] },

/* ---------- ÚROVEŇ 3 ---------- */
{ id: 'l3-01', lvl: 3, title: 'Střídavý proud a reaktance', sub: 'Jak C a L reagují na frekvenci',
  idea: 'Kondenzátor propouští tím víc, čím vyšší je frekvence. Cívka naopak.',
  terms: [['Střídavý proud (AC)', 'Proud, který pravidelně mění směr. V Evropě má síť 230 V a 50 Hz.'], ['Frekvence f (Hz)', 'Počet kmitů za sekundu.'], ['Reaktance X (Ω)', '„Odpor" kondenzátoru nebo cívky vůči střídavému proudu. Závisí na frekvenci.'], ['X_C = 1 / (2π f C)', 'Kapacitní reaktance: s frekvencí klesá.'], ['X_L = 2π f L', 'Induktivní reaktance: s frekvencí roste.']],
  body: `<p>Vraťme se k trubce s membránou. Když pístem jen jednou zatlačíš, voda se po chvíli zastaví. Když ale pístem <b>kmitáš</b> sem a tam, voda na druhé straně membrány kmitá také. Membrána střídavý pohyb „propustí". Čím rychleji kmitáš, tím méně se membrána stihne napnout a tím snáz voda teče.</p>
  <p class="formula">X_C = 1 / (2π · f · C)</p>
  <p>U cívky (těžká hadice) je to naopak: čím rychleji měníš směr, tím méně se voda stihne rozběhnout.</p>
  <p class="formula">X_L = 2π · f · L</p>
  <p>Proud a napětí navíc nejsou „v kroku". U kondenzátoru proud předbíhá napětí o čtvrt periody (nejdřív musí téct, aby se nabil). U cívky napětí předbíhá proud.</p>
  <p>Na tom stojí filtry (další lekce), výhybky v reproduktorech i ladění rádia.</p>`,
  sim: 'ac', task: 'Posouvej frekvenci. Při jaké frekvenci mají kondenzátor 1 µF a cívka 10 mH stejnou reaktanci?',
  qs: [
    { q: 'Zvýšíš frekvenci. Reaktance kondenzátoru:', a: ['klesne', 'vzroste', 'se nezmění', 'klesne na nulu okamžitě'], c: 0, why: 'X_C = 1 / (2π f C): f je ve jmenovateli.' },
    { q: 'Frekvenci zdvojnásobíš. Reaktance cívky:', a: ['se zdvojnásobí', 'klesne na polovinu', 'se nezmění', 'vzroste čtyřikrát'], c: 0, why: 'X_L je přímo úměrná f.' },
    { q: 'Jakou frekvenci má elektrická síť v Evropě?', a: ['50 Hz', '60 Hz', '230 Hz', '100 Hz'], c: 0, why: '60 Hz je v USA (tam je psaný i původní manuál).' },
    { q: 'Jak je to s fází u kondenzátoru ve střídavém obvodu?', a: ['proud předbíhá napětí', 'napětí předbíhá proud', 'proud a napětí jsou ve fázi', 'proud je nulový'], c: 0, why: 'Kondenzátor se musí nejdřív nabít proudem.' },
  ] },

{ id: 'l3-02', lvl: 3, title: 'RC filtr', sub: 'Dolní a horní propust',
  idea: 'Rezistor a kondenzátor tvoří filtr. Nad mezní frekvencí f_m = 1 / (2π R C) signál slábne.',
  terms: [['Dolní propust', 'Propustí nízké frekvence, vysoké utlumí. R v sérii, C k zemi.'], ['Horní propust', 'Opak: C v sérii, R k zemi.'], ['Mezní frekvence f_m', 'Výstup má 70,7 % vstupní amplitudy (−3 dB).'], ['Decibel (dB)', 'Logaritmická míra poměru. −20 dB = desetkrát menší amplituda.']],
  body: `<p>Zapoj rezistor do série a kondenzátor ze výstupu k zemi. Pro <b>pomalé</b> změny se kondenzátor stihne nabíjet a výstup kopíruje vstup. Pro <b>rychlé</b> změny má kondenzátor malou reaktanci a signál „svede" do země. Vznikla <b class="c">dolní propust</b>.</p>
  <p class="formula">f_m = 1 / (2π · R · C)</p>
  <p>Na mezní frekvenci má výstup asi 71 % amplitudy. Nad ní klesá asi desetkrát na každou desetinásobnou frekvenci (−20 dB na dekádu).</p>
  <p>Prohodíš-li R a C, dostaneš <b>horní propust</b>, která propustí jen rychlé změny.</p>
  <p>S Raspberry Pi: Pi nemá analogový výstup. PWM signál ale můžeš vyhladit dolní propustí s f_m hluboko pod frekvencí PWM a dostaneš plynulé napětí. Podobně RC článek potlačí zákmity tlačítka.</p>`,
  sim: 'rcfilter', task: 'Nastav R = 10 kΩ a C = 100 nF. Jaká je mezní frekvence? Kolik projde z PWM s frekvencí 1 kHz?',
  qs: [
    { q: 'R = 1 kΩ, C = 1 µF. Jaká je mezní frekvence?', a: ['asi 159 Hz', '1 kHz', '16 Hz', '1,6 kHz'], c: 0, why: '1 / (2π · 1 000 · 0,000 001) ≈ 159 Hz.' },
    { q: 'Jakou amplitudu má výstup filtru na mezní frekvenci?', a: ['asi 71 % vstupu', '50 %', '0 %', '100 %'], c: 0, why: '1/√2 ≈ 0,707, tedy −3 dB.' },
    { q: 'Chceš z PWM udělat plynulé napětí. Mezní frekvence filtru má být:', a: ['mnohem nižší než frekvence PWM', 'vyšší než frekvence PWM', 'stejná jako frekvence PWM', 'na ní nezáleží'], c: 0, why: 'Filtr musí pulzy PWM utlumit a propustit jen průměr.' },
    { q: 'Prohodíš R a C. Vznikne:', a: ['horní propust', 'dolní propust s vyšší f_m', 'zesilovač', 'oscilátor'], c: 0, why: 'Kondenzátor v sérii propustí jen změny.' },
  ] },

{ id: 'l3-03', lvl: 3, title: 'Indukčnost: jak se počítá', sub: 'Závity, průřez, délka, jádro',
  idea: 'L = μ₀ · μr · N² · A / l. Počet závitů působí kvadraticky, jádro násobí indukčnost permeabilitou.',
  terms: [['Počet závitů N', 'Indukčnost roste s N². Dvakrát víc závitů = čtyřikrát větší L.'], ['Průřez A', 'Plocha závitu (π · r²). Větší průměr = větší L.'], ['Délka l', 'Natažená cívka má menší indukčnost než stlačená.'], ['Permeabilita μr', 'Kolikrát jádro zesílí magnetické pole. Vzduch 1, ferit stovky až tisíce.'], ['Nasycení jádra', 'Při velkém proudu jádro „nestačí" a indukčnost prudce klesne.']],
  body: `<p>Jak vyrobit cívku s požadovanou indukčností? Rozhodují čtyři věci:</p>
  <ol><li><b>Délka</b>: stlačíš-li závity k sobě, ovlivňují se víc a L roste. Indukčnost je nepřímo úměrná délce.</li>
  <li><b>Průřez</b>: větší průměr znamená delší drát na závit a větší plochu pro magnetické pole.</li>
  <li><b>Počet závitů</b>: víc drátu a zároveň víc vzájemného ovlivnění. Proto roste s druhou mocninou N.</li>
  <li><b>Jádro</b>: železo nebo ferit obsahuje „malé magnetky", které se natáčejí s polem a zesilují ho μr-krát.</li></ol>
  <p class="formula">L = μ₀ · μr · N² · A / l</p>
  <p>Vzorec platí dobře pro dlouhé válcové cívky (délka větší než průměr). Ferit se používá pro vysoké frekvence (měniče, filtry), plechy z křemíkové oceli pro síťové transformátory.</p>
  <p>Hotové cívky bývají vyrobené na zakázku a často nemají standardní značení. Malé tlumivky mívají barevné pruhy jako rezistory (hodnota v µH).</p>`,
  sim: 'indcalc', task: 'Zdvojnásob počet závitů. Kolikrát vzroste L? Pak vlož feritové jádro.',
  qs: [
    { q: 'Počet závitů zdvojnásobíš. Indukčnost:', a: ['vzroste čtyřikrát', 'se zdvojnásobí', 'se nezmění', 'klesne na polovinu'], c: 0, why: 'L roste s N².' },
    { q: 'Cívku natáhneš na dvojnásobnou délku (stejné závity). Indukčnost:', a: ['klesne na polovinu', 'se zdvojnásobí', 'se nezmění', 'vzroste čtyřikrát'], c: 0, why: 'L je nepřímo úměrná délce l.' },
    { q: 'Do vzduchové cívky vložíš feritové jádro. Indukčnost:', a: ['výrazně vzroste', 'klesne', 'se nezmění', 'klesne na nulu'], c: 0, why: 'L se násobí permeabilitou μr.' },
    { q: 'Co se stane s indukčností, když se jádro nasytí?', a: ['prudce klesne', 'prudce vzroste', 'nezmění se', 'začne kmitat'], c: 0, why: 'Nasycené jádro už pole nezesiluje.' },
  ] },

{ id: 'l3-04', lvl: 3, title: 'Transformátor, Faraday a Lenz', sub: 'Jak se mění napětí',
  idea: 'Měnící se proud v primáru indukuje napětí v sekundáru: U₂ / U₁ = N₂ / N₁. Výkon se nevyrobí, proud se změní opačně.',
  terms: [['Primární a sekundární vinutí', 'Primár je připojený ke zdroji, ze sekundáru odebíráme.'], ['Převod', 'Poměr závitů N₂ / N₁. Určuje poměr napětí.'], ['Faradayův zákon', 'Změna magnetického pole kolem vodiče v něm indukuje napětí.'], ['Lenzův zákon', 'Indukovaný proud působí proti změně, která ho vyvolala.'], ['Zachování výkonu', 'P = U · I je na obou stranách (skoro) stejné.']],
  body: `<p>Navineš-li dvě cívky na společné železné jádro, vznikne <b class="c">transformátor</b>. Střídavý proud v primáru vytváří v jádru měnící se magnetické pole a to indukuje napětí v sekundáru. Na každý závit připadá stejné napětí, proto:</p>
  <p class="formula">U₂ / U₁ = N₂ / N₁</p>
  <p>Energii ale transformátor nevyrobí. Když napětí zvýší dvakrát, proud na výstupu může být nejvýš poloviční (P = U · I). Navinutí sekundáru opačným směrem obrátí polaritu.</p>
  <p>Přenáší se jen <b>změna</b>. Na stejnosměrný proud reaguje sekundár jen krátce po zapnutí, pak mlčí. To je <b>Faradayův zákon</b>: napětí vzniká, když se magnetické pole kolem vodiče mění, třeba když kolem cívky projíždí magnet. Tak vyrábějí elektřinu alternátory v elektrárnách i dynamo na kole.</p>
  <p><b>Lenzův zákon</b> dodává, že indukovaný proud vždy brzdí pohyb, který ho vyvolal. Čím víc elektřiny chceš z generátoru odebrat, tím těžší je ho roztočit. Energie se nevyrábí z ničeho.</p>
  <p>Moderní nabíječky používají malé transformátory na frekvencích desítek kHz. Při vyšší frekvenci stačí mnohem menší jádro.</p>`,
  sim: 'transformer', task: 'Primár má 1 000 závitů na 230 V. Kolik závitů musí mít sekundár pro asi 12 V?',
  qs: [
    { q: 'N₁ = 1 000, N₂ = 50, U₁ = 230 V. Kolik je U₂?', a: ['11,5 V', '4 600 V', '50 V', '23 V'], c: 0, why: '230 · 50 / 1 000 = 11,5 V.' },
    { q: 'Transformátor sníží napětí desetkrát. Proud v sekundáru oproti primáru:', a: ['bude až desetkrát větší', 'bude desetkrát menší', 'bude stejný', 'bude nulový'], c: 0, why: 'Výkon zůstává zachován: menší U, větší I.' },
    { q: 'Primár připojíš na baterii. Co je na sekundáru po chvíli?', a: ['žádné napětí', 'napětí podle převodu', 'dvojnásobné napětí', 'střídavé napětí 50 Hz'], c: 0, why: 'Ustálený stejnosměrný proud magnetické pole nemění.' },
    { q: 'Co říká Lenzův zákon?', a: ['indukovaný proud působí proti změně, která ho vyvolala', 'napětí je úměrné proudu', 'energie se v transformátoru zvětšuje', 'magnet přitahuje měď'], c: 0, why: 'Proto je generátor pod zátěží těžší roztočit.' },
  ] },

{ id: 'l3-05', lvl: 3, title: 'Rezonance LC a činitel jakosti Q', sub: 'Když si C a L přehazují energii',
  idea: 'Cívka a kondenzátor si přelévají energii tam a zpět a rezonují na f₀ = 1 / (2π √(L C)). Vysoké Q znamená ostrý výběr.',
  terms: [['Rezonanční frekvence f₀', 'Frekvence, při které se X_L a X_C vyrovnají.'], ['Oscilace', 'Pravidelné kmitání energie mezi C a L.'], ['Činitel jakosti Q', 'Poměr reaktance k odporu cívky: Q = X_L / r. Čím větší, tím užší rezonance.'], ['Šířka pásma', 'Rozsah frekvencí kolem f₀, který obvod ještě propustí.']],
  body: `<p>Spoj membránu (kondenzátor) s těžkou hadicí (cívkou). Napnutá membrána vodu vytlačí, voda se setrvačností přežene a membránu napne na druhou stranu. A znovu. Vzniklo kyvadlo: energie se přelévá mezi elektrickým polem kondenzátoru a magnetickým polem cívky.</p>
  <p class="formula">f₀ = 1 / (2π · √(L · C))</p>
  <p>Na této frekvenci se reaktance cívky a kondenzátoru přesně vyruší (X_L = X_C). V sériovém obvodu pak proud omezuje jen odpor drátu a je největší.</p>
  <p><b class="c">Činitel jakosti Q</b> říká, jak ostrá rezonance je: Q = X_L / r (r je odpor vinutí). Vyšší Q získáš jádrem, které zvýší L, nebo silnějším drátem, který sníží r. Čím vyšší Q, tím přesněji obvod vybere jednu frekvenci.</p>
  <p>Využití: ladění rádia (otočný kondenzátor mění f₀), filtry, oscilátory a bezdrátové nabíjení telefonů.</p>`,
  sim: 'lc', task: 'Najdi f₀ pro L = 10 mH a C = 1 µF. Pak zmenšuj odpor a sleduj, jak se křivka zužuje.',
  qs: [
    { q: 'LC obvod je v rezonanci, když:', a: ['X_L = X_C', 'L = C', 'odpor je nulový', 'proud je nulový'], c: 0, why: 'Reaktance se vzájemně vyruší.' },
    { q: 'Kapacitu zvětšíš čtyřikrát. Rezonanční frekvence:', a: ['klesne na polovinu', 'klesne na čtvrtinu', 'vzroste dvakrát', 'se nezmění'], c: 0, why: 'f₀ ~ 1 / √C, √4 = 2.' },
    { q: 'Vyšší činitel jakosti Q znamená:', a: ['užší, ostřejší výběr frekvence', 'širší propustné pásmo', 'nižší rezonanční frekvenci', 'větší ztráty'], c: 0, why: 'Vysoké Q = malé ztráty a úzká rezonance.' },
    { q: 'Co zvýší Q cívky?', a: ['menší odpor vinutí při stejné indukčnosti', 'tenčí drát', 'vyšší odpor', 'kratší doba zapnutí'], c: 0, why: 'Q = X_L / r.' },
  ] },

{ id: 'l3-06', lvl: 3, title: 'Polovodiče zevnitř: PN přechod', sub: 'Proč dioda vede jen jedním směrem',
  idea: 'Dotováním křemíku vznikne vrstva N (volné elektrony) a P (díry). Jejich rozhraní vede jen jedním směrem.',
  terms: [['Polovodič', 'Materiál mezi vodičem a izolantem, typicky křemík. S teplotou vede lépe.'], ['Dotování', 'Přidání nepatrného množství příměsi, které změní vodivost.'], ['Typ N', 'Příměs (např. fosfor) přidá volné elektrony.'], ['Typ P', 'Příměs (např. bor) vytvoří díry: místa, kde elektron chybí.'], ['Vyprázdněná oblast', 'Tenká vrstva na rozhraní P a N bez volných nosičů náboje.']],
  body: `<p>Čistý křemík vede proud špatně: každý atom drží své čtyři vnější elektrony ve vazbách se sousedy. Když ale do krystalu přidáme nepatrné množství příměsi, vodivost se výrazně změní. Tomu se říká <b class="c">dotování</b>.</p>
  <ul><li><b>Typ N</b>: fosfor má o elektron víc. Ten je volný a může se pohybovat.</li><li><b>Typ P</b>: bor má o elektron méně. Vznikne <b>díra</b>, která se chová jako pohyblivý kladný náboj.</li></ul>
  <p>Na rozhraní P a N se volné elektrony a díry navzájem zaplní a vznikne tenká <b>vyprázdněná oblast</b>. Ta je bariérou. Když na P přivedeš plus a na N minus (propustný směr), bariéra se zúží a nad asi 0,7 V proud poteče. Obráceně se bariéra rozšíří a proud neteče. To je dioda.</p>
  <p>V LED elektrony při přechodu „padají" do děr a uvolněná energie vyletí jako světlo. Barva závisí na materiálu. Fotovoltaický článek dělá opak: světlo vytváří páry elektron–díra a vzniká proud.</p>
  <p>Tranzistor NPN jsou dva přechody za sebou s velmi tenkou bází uprostřed. Většina elektronů z emitoru bází „proletí" až do kolektoru.</p>`,
  sim: null,
  qs: [
    { q: 'Polovodič typu N obsahuje přebytek:', a: ['volných elektronů', 'děr', 'protonů', 'neutronů'], c: 0, why: 'N = negativní nosiče.' },
    { q: 'Co je díra v polovodiči?', a: ['místo, kde chybí elektron, chová se jako kladný náboj', 'fyzický otvor v krystalu', 'volný elektron', 'atom fosforu'], c: 0, why: 'Díra se „pohybuje", když ji zaplní sousední elektron.' },
    { q: 'Dioda je v propustném směru, když:', a: ['P (anoda) má vyšší napětí než N (katoda)', 'N má vyšší napětí než P', 'obě strany mají stejné napětí', 'je zahřátá'], c: 0, why: 'Pak se vyprázdněná oblast zúží.' },
    { q: 'Barva světla LED závisí hlavně na:', a: ['materiálu polovodiče', 'velikosti proudu', 'barvě pouzdra', 'napětí baterie'], c: 0, why: 'Energii fotonu určuje materiál přechodu.' },
  ] },

{ id: 'l3-07', lvl: 3, title: 'FET a MOSFET', sub: 'Spínání napětím',
  idea: 'Tranzistor řízený polem spíná napětím na hradle, téměř bez proudu. Pro Raspberry Pi vybírej MOSFET s logickou úrovní.',
  terms: [['FET', 'Field Effect Transistor. Vývody: hradlo G, zdroj S (source), kolektor D (drain).'], ['Prahové napětí U_GS(th)', 'Napětí hradla, při kterém kanál začne vést.'], ['R_DS(on)', 'Odpor sepnutého kanálu, často jen miliohmy.'], ['Logic-level MOSFET', 'Plně sepne už při 2,5–4,5 V, takže ho lze řídit přímo z GPIO.'], ['Citlivost na statiku', 'Tenkou izolaci hradla prorazí i výboj statické elektřiny.']],
  body: `<p>Představ si trubku, jejíž část je z tenké pružné gumy. Kolem ní je voda z třetí trubky, <b>hradla</b>. Když v hradle zvýšíš tlak, guma kanál přiškrtí. Hradlem přitom žádná voda neteče. To je tranzistor řízený polem, <b class="c">FET</b>.</p>
  <p>U <b>MOSFETu</b> je hradlo od kanálu oddělené tenkou vrstvou oxidu. Chová se jako malý kondenzátor: proud teče jen při přepínání. U N-MOSFETu kladné napětí na hradle kanál otevře a sepnutý kanál má odpor jen desítky miliohmů. Proto MOSFET spíná ampéry a skoro se nehřeje.</p>
  <p>Pozor na napětí hradla. Mnoho výkonových MOSFETů (IRF520, IRFZ44N) se plně otevře až při 10 V; při 3,3 V z GPIO zůstanou napůl sepnuté a hřejí se. Pro Raspberry Pi vybírej <b>logic-level</b> typ, jehož R_DS(on) výrobce udává pro U_GS = 2,5 V (například AO3400, IRLZ44N je hraniční).</p>
  <p>Zapojení: GPIO → rezistor 100 Ω → hradlo; mezi hradlo a GND rezistor 100 kΩ, aby hradlo při startu Raspberry Pi „neplavalo" a MOSFET náhodně nesepnul.</p>`,
  sim: 'mosfet', task: 'Nastav hradlo na 3,3 V a porovnej logic-level a standardní MOSFET při zátěži 2 A.',
  qs: [

function num(x, d = 3) { if (!isFinite(x)) return '∞'; if (Math.abs(x) < 1e-9) x = 0; return Number(Number(x).toPrecision(d)).toLocaleString('cs-CZ', { maximumFractionDigits: 6 }); }

/* ---------- Osciloskop pro RC a RL ---------- */
function scopeSim(root, kind, opts = {}) {
  const isC = kind === 'C';
  const q = mount(root, figT('Simulace', isC ? 'nabíjení kondenzátoru (zpomaleno)' : 'proud cívkou (zpomaleno)') + `<div class="fig-body"><div id="aSvg"></div><canvas style="aspect-ratio:2/1" aria-label="Průběh napětí a proudu v čase"></canvas>
  <div class="legend"><span><i style="background:var(--muted)"></i>napětí zdroje</span><span><i style="background:var(--copper)"></i>${isC ? 'napětí na kondenzátoru' : 'napětí na cívce'}</span><span><i style="background:var(--water)"></i>proud</span></div>
  <div class="controls"><div class="btns"><button class="btn primary" id="aSw" type="button"></button>${opts.flyback ? '<label class="lbl" style="align-items:center;gap:.4rem;justify-content:flex-start"><input type="checkbox" id="aFb"> ochranná dioda</label>' : ''}</div>
  ${isC ? rng('aP', 'Kapacita C (R = 1 kΩ)', 100, 2000, 50, 500) : rng('aP', 'Indukčnost L (R = 10 Ω)', 2, 20, 1, 8)}
  <div class="readouts">${ro('rT', 'Časová konstanta', '')}${ro('rV', isC ? 'U na C' : 'U na cívce', 'c')}${ro('rI', 'Proud', 'w')}${ro('rPk', 'Špička')}</div></div></div>`);
  const U0 = 9, R = isC ? 1000 : 10, Roff = 300; let on = false, x = 0, t = 0, acc = 0, peak = 0, hist = [], dash = 0, lastB = null;
  const k = canvasKit(q('canvas'));
  const par = () => isC ? +q('#aP').value * 1e-6 : +q('#aP').value;
  const lab = () => { q('#aSw').textContent = isC ? (on ? 'Odpojit a vybít' : 'Připojit zdroj 9 V') : (on ? 'Rozepnout spínač' : 'Sepnout spínač'); };
  onInputs(q, ['aP'], () => { const p = par(); q('#aPo').textContent = isC ? si(p, 'F') : num(p) + ' H'; q('#rT').textContent = num(isC ? R * p : p / R) + ' s'; });
  lab(); q('#aSw').onclick = () => { on = !on; peak = 0; lab(); };
  const analog = () => {
    if (isC) { const b = Math.round(x / U0 * 200) / 200; if (b === lastB) return; lastB = b; q('#aSvg').innerHTML = S.svg(360, 100, `<rect x="20" y="25" width="320" height="50" class="pipe"/><rect x="${40 + b * 60}" y="28" width="14" height="44" class="if"/><path class="sy" d="M20 50H${40 + b * 60}"/><path d="M190 25Q${190 + b * 70} 50 190 75" style="fill:none;stroke:var(--copper);stroke-width:5"/>` + S.t(190, 16, 'membrána', 'txm', 'middle') + S.t(60, 94, 'píst (zdroj)', 'txm', 'middle'), 'Trubka s membránou'); }
    else if (!q('#hose')) { let d = 'M20 50H70'; for (let a = 0; a <= Math.PI * 12; a += .2) { const xx = 80 + a * 6.2 + 16 * Math.sin(a), yy = 50 - 24 * Math.cos(a); d += `L${xx.toFixed(1)} ${yy.toFixed(1)}`; } d += 'L340 50'; q('#aSvg').innerHTML = S.svg(360, 100, `<path d="${d}" style="fill:none;stroke:var(--water-soft);stroke-width:12;stroke-linejoin:round"/><path id="hose" d="${d}" style="fill:none;stroke:var(--water);stroke-width:2.5;stroke-dasharray:5 7"/><g id="spark" style="opacity:0"><path d="M345 20l-10 18h8l-6 18 16-24h-9l7-12z" style="fill:var(--bad)"/></g>` + S.t(180, 96, 'dlouhá hadice = cívka', 'txm', 'middle'), 'Hadice'); }
  };
  return { step(dt) {
    const p = par(), fb = opts.flyback && q('#aFb').checked; const n = Math.max(1, Math.ceil(dt / 0.0005)), hh = dt / n; let vs = 0, v2 = 0, i = 0;
    for (let s = 0; s < n; s++) {
      t += hh; vs = on ? U0 : 0;
      if (isC) { x += (vs - x) / (R * p) * hh; i = (vs - x) / R; v2 = x; }
      else if (on) { x += (vs - R * x) / p * hh; i = x; v2 = vs - R * x; }
      else if (fb) { if (x > 0) x = Math.max(0, x + (-0.7 - R * x) / p * hh); i = x; v2 = x > 0 ? -0.7 : 0; }
      else { x += (-(R + Roff) * x) / p * hh; i = x; v2 = -(R + Roff) * x; }
    }
    if (Math.abs(v2) > Math.abs(peak)) peak = v2;
    acc += dt; while (acc > 1 / 40) { acc -= 1 / 40; hist.push([vs, v2, i]); if (hist.length > 320) hist.shift(); }
    q('#rV').textContent = num(Math.abs(v2) < 1e-3 ? 0 : v2, 3) + ' V'; q('#rI').textContent = si(Math.abs(i) < 1e-6 ? 0 : i, 'A'); q('#rPk').textContent = num(peak, 3) + ' V';
    analog();
    if (!isC) { dash -= i / (U0 / R) * dt * 90; const hs = q('#hose'); if (hs) hs.style.strokeDashoffset = dash; const sp = q('#spark'); if (sp) sp.style.opacity = clamp(Math.abs(v2) / 60, 0, 1); }
    const { ctx, w } = k; if (!w) return; const Imax = U0 / R;
    const pl = plot(k, { x0: 0, x1: 320, y0: -2 * U0, y1: 2 * U0, yt: [-18, -9, 0, 9, 18], yf: (v) => v + ' V', left: 44, bottom: 10, top: 10 });
    const tr = (ix, col, sc) => { ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.beginPath(); hist.forEach((hv, j) => { const xx = pl.X(320 - hist.length + j), yy = pl.Y(clamp(hv[ix] * sc, -2.3 * U0, 2.3 * U0)); j ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }); ctx.stroke(); };
    tr(0, C.muted, 1); tr(1, C.copper, 1); tr(2, C.water, U0 / Imax); pl.done();
    if (Math.abs(peak) > 2 * U0) { ctx.fillStyle = C.bad; ctx.font = '700 12px "Archivo",sans-serif'; ctx.textAlign = 'right'; ctx.fillText(`špička ${num(peak, 3)} V (mimo graf)`, w - 18, k.h - 16); }
  } };
}
SIMS.rc = (root) => scopeSim(root, 'C');
SIMS.rl = (root) => scopeSim(root, 'L');
SIMS.relay = (root) => scopeSim(root, 'L', { flyback: true });

SIMS.capcode = (root) => {

  const T = { B: '±0,1 pF', C: '±0,25 pF', D: '±0,5 pF', F: '±1 %', G: '±2 %', J: '±5 %', K: '±10 %', M: '±20 %', Z: '+80 / −20 %' };
  const q = mount(root, figT('Dekodér', 'značení kondenzátorů') + `<div class="fig-body"><div class="ctl"><label for="mkIn">Kód z pouzdra</label><div class="btns"><input type="text" id="mkIn" value="104" size="8" autocomplete="off"><button class="btn primary" id="mkGo" type="button">Rozluštit</button></div></div>
  <div class="btns">${['104', '473J', '222K', '4n7', '2R2', '1H', '100'].map((c) => `<button class="btn small" data-c="${c}" type="button">${c}</button>`).join('')}</div><div class="note" id="mkOut" aria-live="polite"></div></div>`);

    else if ((m = raw.match(/^(\d*)([pnuµPNUR])(\d*)$/)) && (m[1] || m[3])) { const u = m[2].toLowerCase(); const v = parseFloat((m[1] || '0') + '.' + (m[3] || '0')); if (u === 'r') o = `<h4>Kód ${raw}</h4><p>R stojí místo desetinné čárky: <b class="c">${num(v)}</b>. U malých keramických to bývají pF, u elektrolytů µF.</p>`; else { const f = { p: 1e-12, n: 1e-9, u: 1e-6, µ: 1e-6 }[u]; o = `<h4>Kód ${raw}</h4><p>Písmeno ${m[2]} stojí místo desetinné čárky a určuje jednotku: <b class="c">${si(v * f, 'F')}</b>.</p>`; } }

/* ---------- 24 MOSFET ---------- */

/* ================= Stav a ukládání ================= */
const pad2 = (n) => String(n).padStart(2, '0');

const parseIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const DEF = () => ({ v: 1, updated: 0, plan: { start: today(), days: [1, 2, 3, 4, 5], from: 1 }, done: {}, srs: {}, todos: {}, score: {} });
const LS_KEY = 'e15min:state';
function normalize(r) { const d = DEF(); const o = JSON.parse(JSON.stringify(r || {})); return { ...d, ...o, plan: { ...d.plan, ...(o.plan || {}) }, done: o.done || {}, srs: o.srs || {}, todos: o.todos || {}, score: o.score || {} }; }

let syncMode = 'local', docRef = null, saving = false, pendingPush = false, tPush = null, inLesson = false;
const localSave = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* prohlížeč úložiště blokuje */ } };
function save() { state.updated = Date.now(); localSave(); if (docRef) { clearTimeout(tPush); tPush = setTimeout(pushRemote, 1200); } }
async function pushRemote() {
  if (!docRef) return; if (saving) { pendingPush = true; return; } saving = true;
  try { await docRef.set(JSON.parse(JSON.stringify(state))); syncMode = 'cloud'; }
  catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { docRef = null; syncMode = 'local'; } else if (e && e.code === 'unavailable') { setTimeout(pushRemote, 3000 + Math.random() * 2000); } }
  saving = false; if (pendingPush) { pendingPush = false; pushRemote(); }
}
async function initSync() {
  try {
    const cl = window.claude; if (!cl || !cl.use) return;
    const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]); if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    docRef = db.doc('data/users/' + uid + '/state');
    const snap = await docRef.get(); syncMode = 'cloud';
    if (snap.exists) { const r = snap.data(); if ((r.updated || 0) > (state.updated || 0)) { state = normalize(r); localSave(); if (!inLesson) route(); } else if ((state.updated || 0) > (r.updated || 0)) pushRemote(); }
    else if (state.updated) pushRemote();

  } catch (e) { syncMode = 'local'; }
}

/* ================= Plán a kalendář ================= */

const planned = () => LESSONS.filter((l) => l.lvl >= state.plan.from);
function schedule() {
  const map = {}; const t = today();
  for (const [id, d] of Object.entries(state.done)) { if (!LBY[id]) continue; (map[d] = map[d] || []).push({ id, st: 'done' }); }
  const rest = planned().filter((l) => !state.done[l.id]);

  if (map[t] && d === t) d = addDays(t, 1);
  let guard = 0;
  for (const l of rest) { while (!state.plan.days.includes(parseIso(d).getDay()) && guard++ < 800) d = addDays(d, 1); (map[d] = map[d] || []).push({ id: l.id, st: 'plan' }); d = addDays(d, 1); }
  for (let x = state.plan.start; x < t; x = addDays(x, 1)) { if (state.plan.days.includes(parseIso(x).getDay()) && !map[x]) map[x] = [{ id: null, st: 'miss' }]; if (guard++ > 2000) break; }

}

  while (g++ < 1000 && d >= state.plan.start) { if (days.includes(parseIso(d).getDay())) { if (doneDays.has(d)) n++; else break; } else if (doneDays.has(d)) n++; d = addDays(d, -1); }

  const t = today(); pool.sort((a, b) => { const da = a.r ? a.r.d : '0000', db = b.r ? b.r.d : '0000'; const dueA = da <= t, dueB = db <= t; if (dueA !== dueB) return dueA ? -1 : 1; if (da !== db) return da < db ? -1 : 1; return (a.r ? a.r.b : 0) - (b.r ? b.r.b : 0) || Math.random() - .5; });

    const d = addDays(start, i); const inM = d.slice(0, 7) === calMonth; if (i >= 35 && !inM && i % 7 === 0) break;
    const e = sch[d] || []; const done = e.find((x) => x.st === 'done'), pl = e.find((x) => x.st === 'plan'), miss = e.find((x) => x.st === 'miss');
    const cls = ['day', inM ? '' : 'out', done ? 'done' : pl ? 'plan' : miss ? 'miss' : '', d === t ? 'today' : '', d === calSel ? 'sel' : ''].join(' ');
    const mark = done ? '✓ ' + LBY[done.id].code : pl ? LBY[pl.id].code : miss ? '–' : '';
    cells += `<button type="button" class="${cls}" data-d="${d}" aria-label="${fmtDay(d)}${done ? ', lekce hotová' : pl ? ', naplánovaná lekce ' + LBY[pl.id].title : miss ? ', vynecháno' : ''}"><span class="d">${+d.slice(8)}</span>${(state.todos[d] || []).length ? '<i class="dot"></i>' : ''}<span class="m">${mark}</span></button>`;
  }
  const mName = first.toLocaleDateString('cs-CZ', { month: 'long', year: 'numeric' });
  const dn = ['Ne', 'Po', 'Út', 'St', 'Čt', 'Pá', 'So'];
  view.innerHTML = `<div><span class="eyebrow">Plán a úkoly</span><h1>Kalendář</h1></div>
  <section class="card stack"><div class="cal-head"><button class="iconbtn" id="cPrev" type="button" aria-label="Předchozí měsíc"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><h3 style="text-transform:capitalize">${mName}</h3><button class="iconbtn" id="cNext" type="button" aria-label="Další měsíc"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <div class="cal">${['Po', 'Út', 'St', 'Čt', 'Pá', 'So', 'Ne'].map((x) => `<span class="dow">${x}</span>`).join('')}${cells}</div>
  <div class="cal-legend"><span><i style="background:var(--good-soft);border-color:var(--good)"></i>hotovo</span><span><i style="border-color:var(--copper)"></i>naplánováno</span><span><i style="background:var(--bad-soft);border-color:var(--line)"></i>vynecháno</span><span><i style="background:var(--water);border-color:var(--water);border-radius:50%;width:8px;height:8px"></i>vlastní úkol</span></div></section>
  <section class="card stack"><h3 style="text-transform:none">${fmtDay(calSel)}</h3>${todoBlock(calSel)}</section>
  <section class="card stack"><h3>Nastavení plánu</h3>
    <div class="ctl"><label for="pStart">Začátek plánu</label><input type="date" id="pStart" value="${state.plan.start}"></div>
    <div class="stack" style="gap:.3rem"><span class="lbl">Dny s lekcí</span><div class="wd">${[1, 2, 3, 4, 5, 6, 0].map((i) => `<button type="button" class="btn small" data-wd="${i}" aria-pressed="${state.plan.days.includes(i)}">${dn[i]}</button>`).join('')}</div></div>
    <div class="ctl"><label for="pFrom">Začít od úrovně</label><select id="pFrom">${LEVELS.map((L) => `<option value="${L.n}" ${state.plan.from === L.n ? 'selected' : ''}>${L.n}: ${L.name} (${L.sub})</option>`).join('')}</select></div>
    <p class="cap">Nedokončené lekce se vždy rozloží od dneška na zvolené dny. Když den vynecháš, plán se posune; nic se neztratí.</p>
    <p class="cap">${syncMode === 'cloud' ? 'Postup se ukládá do tvého účtu a je stejný na telefonu i počítači.' : 'Postup se ukládá jen v tomto prohlížeči.'}</p>
    <div class="btns">${confirmReset ? '<button class="btn" id="rsYes" type="button" style="border-color:var(--bad);color:var(--bad)">Ano, smazat celý postup</button><button class="btn ghost" id="rsNo" type="button">Zrušit</button>' : '<button class="btn ghost" id="rsAsk" type="button">Smazat postup…</button>'}</div></section>`;
  view.querySelector('.cal').addEventListener('click', (e) => { const b = e.target.closest('[data-d]'); if (!b) return; calSel = b.dataset.d; if (calSel.slice(0, 7) !== calMonth) calMonth = calSel.slice(0, 7); renderCal(); });
  $('#cPrev').onclick = () => { const d = new Date(y, m - 2, 1); calMonth = iso(d).slice(0, 7); renderCal(); };
  $('#cNext').onclick = () => { const d = new Date(y, m, 1); calMonth = iso(d).slice(0, 7); renderCal(); };
  $('#pStart').onchange = (e) => { if (e.target.value) { state.plan.start = e.target.value; save(); updStreak(); renderCal(); } };
  view.querySelectorAll('[data-wd]').forEach((b) => b.onclick = () => { const i = +b.dataset.wd; const s = new Set(state.plan.days); if (s.has(i)) { if (s.size === 1) { toast('Nech v plánu aspoň jeden den.'); return; } s.delete(i); } else s.add(i); state.plan.days = [...s].sort(); save(); updStreak(); renderCal(); });
  $('#pFrom').onchange = (e) => { state.plan.from = +e.target.value; save(); renderCal(); };
  if ($('#rsAsk')) $('#rsAsk').onclick = () => { confirmReset = true; renderCal(); };
  if ($('#rsNo')) $('#rsNo').onclick = () => { confirmReset = false; renderCal(); };
  if ($('#rsYes')) $('#rsYes').onclick = () => { confirmReset = false; const p = state.plan; state = DEF(); state.plan = { ...p, start: today() }; save(); updStreak(); toast('Postup smazán'); renderCal(); };
  bindTodos(view, renderCal);
}

/* ================= Obrazovka: Pojmy ================= */
function renderGloss() {
  setTab('pojmy'); const all = []; for (const l of LESSONS) for (const [t, d] of l.terms) all.push({ t, d, l }); all.sort((a, b) => a.t.localeCompare(b.t, 'cs'));
  view.innerHTML = `<div><span class="eyebrow">${all.length} pojmů ze všech lekcí</span><h1>Pojmy</h1></div><input type="text" id="gq" placeholder="Hledat pojem…" autocomplete="off" aria-label="Hledat pojem"><dl class="gl" id="gl"></dl>`;
  const draw = () => { const qv = $('#gq').value.trim().toLowerCase(); $('#gl').innerHTML = all.filter((x) => !qv || (x.t + ' ' + x.d).toLowerCase().includes(qv)).map((x) => `<dt>${esc(x.t)}</dt><dd>${esc(x.d)} <small>· <a href="#${x.l.id}">lekce ${x.l.code}</a>${state.done[x.l.id] ? '' : ' (zatím neprobráno)'}</small></dd>`).join('') || '<p class="muted">Nic nenalezeno.</p>'; };
  $('#gq').addEventListener('input', draw); draw();
}

/* ================= Lekce ================= */
function qBlock(items, name, onDone) {
  // items: [{l, i, qq, from}]
  const wrap = document.createElement('div'); wrap.className = 'stack'; let answered = 0, ok = 0;
  const sc = document.createElement('p'); sc.className = 'score';
  items.forEach((it, k) => {
    const order = it.qq.a.map((_, j) => j).sort(() => Math.random() - .5);
    const fs = document.createElement('fieldset'); fs.className = 'q';
    fs.innerHTML = `<legend>${it.from ? `<span class="from">z lekce ${it.l.code} · ${esc(it.l.title)}</span>` : ''}${esc(it.qq.q)}</legend><div class="ans">${order.map((j) => `<label><input type="radio" name="${name}-${k}" value="${j}"><span>${esc(it.qq.a[j])}</span></label>`).join('')}</div><p class="why" hidden></p>`;
    fs.addEventListener('change', (e) => {
      const j = +e.target.value, good = j === it.qq.c; answered++; if (good) ok++;
      fs.querySelectorAll('input').forEach((x) => x.disabled = true);
      fs.querySelectorAll('label').forEach((lb) => { const v = +lb.querySelector('input').value; if (v === it.qq.c) lb.classList.add('ok'); else if (v === j) lb.classList.add('ko'); });
      const w = fs.querySelector('.why'); w.hidden = false; w.innerHTML = `<b style="color:var(--${good ? 'good' : 'bad'})">${good ? 'Správně.' : 'Ne tak docela.'}</b> ${esc(it.qq.why)}`;
      record(it.l.id + ':' + it.i, good); save();
      sc.textContent = `${ok} z ${items.length} správně`; if (answered === items.length && onDone) onDone(ok, items.length);
    });
    wrap.appendChild(fs);
  });
  sc.textContent = `0 z ${items.length} správně`; wrap.appendChild(sc); return wrap;
}

function renderLesson(id) {
  const l = LBY[id]; if (!l) { location.hash = 'dnes'; return; }
  setTab(null); inLesson = true; teardownSim(); document.body.classList.add('lesson');
  const review = reviewFor(id);
  const steps = [['Opakování', 'rev'], ['Klíčové pojmy', 'terms'], ['Výklad', 'body']].concat(l.sim ? [['Simulace', 'sim']] : []).concat([['Kontrolní otázky', 'check'], ['Hotovo', 'done']]);
  let cur = 0, checkScore = null; const t0 = Date.now();
  view.innerHTML = `<div class="lesson-top"><div class="row"><a class="iconbtn" href="#dnes" aria-label="Zavřít lekci"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></a><span class="ttl">${l.code} · ${esc(l.title)}</span><span class="timer" id="tmr">0:00</span></div><div class="steps" id="stp">${steps.map((s, i) => `<button type="button" data-i="${i}" aria-label="Krok ${i + 1}: ${s[0]}"><i></i></button>`).join('')}</div></div><div id="stepBox"></div>
  <nav class="navbar"><div class="navbar-in"><button class="btn ghost" id="bBack" type="button">Zpět</button><button class="btn primary" id="bNext" type="button">Další</button></div></nav>`;
  const box = $('#stepBox');
  const head = (i) => `<div class="step-label"><span class="k">${i + 1}</span><div><span class="eyebrow">Krok ${i + 1} z ${steps.length}</span><h2>${steps[i][0]}</h2></div></div>`;
  const show = (i) => {
    teardownSim(); cur = i; window.scrollTo(0, 0); const kind = steps[i][1]; box.innerHTML = `<section class="step">${head(i)}<div id="sb" class="stack" style="gap:1rem"></div></section>`; const sb = $('#sb');
    if (kind === 'rev') {
      if (!review.length) sb.innerHTML = `<p class="prose">Tohle je ${Object.keys(state.done).length ? 'lekce, ke které zatím nemáš co opakovat' : 'tvoje první lekce'}. Od příště tu budou tři otázky z předchozích lekcí. Vybavování z paměti je nejúčinnější způsob, jak si učivo udržet.</p>`;
      else { sb.innerHTML = `<p class="prose">Než začneš, zkus si vybavit, co už víš. Otázky vybírá aplikace podle toho, co ti dřív šlo nejhůř nebo co jsi dlouho neopakoval(a).</p>`; sb.appendChild(qBlock(review.map((r) => ({ l: r.l, i: r.i, qq: r.qq, from: true })), 'rev')); }
    } else if (kind === 'terms') {
      sb.innerHTML = `<div class="meta">${lvlPill(l.lvl)}<span>${esc(l.sub)}</span></div><p class="idea">${esc(l.idea)}</p><div class="terms">${l.terms.map(([a, b]) => `<div class="term"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>`;
    } else if (kind === 'body') {
      sb.innerHTML = `<div class="prose">${l.body}</div>${FIG[l.id] ? FIG[l.id]() : ''}`;
    } else if (kind === 'sim') {
      sb.innerHTML = `<div class="note try"><h4>Úkol</h4><p>${esc(l.task)}</p></div><figure class="fig" id="simRoot"></figure>`;
      simInst = SIMS[l.sim]($('#simRoot'));
    } else if (kind === 'check') {
      sb.innerHTML = `<p class="prose">Odpověz bez nahlížení. Chyba nevadí: vysvětlení se ukáže hned a otázka se ti vrátí v opakování.</p>`;
      sb.appendChild(qBlock(l.qs.map((qq, i) => ({ l, i, qq })), 'chk', (ok, n) => { checkScore = [ok, n]; state.score[id] = { ok, n }; save(); }));
    } else if (kind === 'done') {
      const first = !state.done[id]; if (first) { state.done[id] = today(); save(); updStreak(); }
      const nl = nextLesson(); const sc = checkScore || (state.score[id] ? [state.score[id].ok, state.score[id].n] : null); const mins = Math.max(1, Math.round((Date.now() - t0) / 60000));
      sb.innerHTML = `<div class="done-hero"><div class="bigcheck">${ICON_CHECK}</div><h2>Lekce ${l.code} je hotová</h2><p>${sc ? `Kontrolní otázky: ${sc[0]} z ${sc[1]} správně. ` : ''}Trvalo ti to asi ${mins} min.</p><p class="idea">${esc(l.idea)}</p><p class="muted">V kalendáři je den odškrtnutý. Série: ${streak()} ${streak() === 1 ? 'den' : streak() < 5 && streak() > 0 ? 'dny' : 'dní'}.</p></div>`
        + `<div class="btns"><a class="btn primary" href="#dnes">Zpět na dnešek</a>${nl && nl.id !== id ? `<a class="btn" href="#${nl.id}">Další lekce: ${esc(nl.title)}</a>` : ''}<a class="btn ghost" href="#kalendar">Kalendář</a></div>`;
    }
    document.querySelectorAll('#stp button').forEach((b, j) => { b.className = j === i ? 'on' : j < i ? 'past' : ''; b.setAttribute('aria-current', j === i ? 'step' : 'false'); });
    $('#bBack').disabled = i === 0; $('#bNext').hidden = kind === 'done'; $('#bBack').hidden = kind === 'done';
    $('#bNext').textContent = steps[i + 1] && steps[i + 1][1] === 'done' ? 'Dokončit lekci' : 'Další';
  };
  $('#bBack').onclick = () => cur > 0 && show(cur - 1); $('#bNext').onclick = () => cur < steps.length - 1 && show(cur + 1);
  $('#stp').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (!b) return; const j = +b.dataset.i; if (steps[j][1] === 'done' && cur < j - 1) return; show(j); });
  const tick = () => { if (!inLesson || !$('#tmr')) return; const s = Math.floor((Date.now() - t0) / 1000); $('#tmr').textContent = `${Math.floor(s / 60)}:${pad2(s % 60)}${s >= 900 ? ' · 15 min ✓' : ''}`; };
  clearInterval(window.__tmr); window.__tmr = setInterval(tick, 1000);
  show(0);
}

/* ================= Směrování ================= */
function route() {
  const h = location.hash.replace('#', '') || 'dnes';
  if (LBY[h]) { renderLesson(h); return; }
  inLesson = false; document.body.classList.remove('lesson'); teardownSim(); clearInterval(window.__tmr); window.scrollTo(0, 0);
  ({ dnes: renderToday, kurz: renderCourse, kalendar: renderCal, pojmy: renderGloss }[h] || renderToday)();
  updStreak();
}
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => { location.hash = b.dataset.tab; }));
window.addEventListener('hashchange', route);

/* ================= Téma, animace, start ================= */
readColors();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); } catch (e) { /* starší prohlížeč */ }
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
const MOTION = !matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastT = performance.now();
function frame(t) { const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t; if (simInst && simInst.step) { try { simInst.step(dt, MOTION); } catch (e) { console.error(e); simInst = null; } } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
route();
initSync();
</script>
