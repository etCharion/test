<title>Elektronika 15 minut denně</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: mobilní aplikace na technickém mřížkovém papíře. Jeden sloupec (max 760 px), dole lišta záložek,
   lekce jako krokový „výkres" s číslovanými kroky. Voda = analogie, měď = elektronika. */
:root{
  --bg:#eef1ec; --surface:#fbfcfa; --sunk:#e4e9e2; --ink:#18262b; --muted:#56666a; --line:#c6d0c8; --grid:rgba(40,90,80,.07);
  --copper:#a9571f; --copper-soft:rgba(169,87,31,.13); --water:#1c74ab; --water-soft:rgba(28,116,171,.15);
  --good:#2b7a4b; --good-soft:rgba(43,122,75,.13); --bad:#b8352a; --bad-soft:rgba(184,53,42,.11); --warn:#94630f;
  --l1:#2b7a4b; --l2:#1c74ab; --l3:#a9571f;
  --pcb:#1f5b3e; --silk:#f2f2e6; --lead:#8d949a; --edge:rgba(0,0,0,.25);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --s-1:.82rem; --s0:1.03rem; --s1:1.25rem; --s2:1.6rem; --s3:clamp(1.9rem,6vw,2.6rem);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1615; --surface:#15201e; --sunk:#1b2826; --ink:#dde7e2; --muted:#93a6a0; --line:#2c3c39; --grid:rgba(140,200,180,.05);
  --copper:#e39a62; --copper-soft:rgba(227,154,98,.15); --water:#62b9ec; --water-soft:rgba(98,185,236,.16);
  --good:#62c98f; --good-soft:rgba(98,201,143,.14); --bad:#ef6f60; --bad-soft:rgba(239,111,96,.13); --warn:#e2b25a;
  --l1:#62c98f; --l2:#62b9ec; --l3:#e39a62;
  --pcb:#2f7f56; --silk:#f2f2e6; --lead:#9aa2a8; --edge:rgba(255,255,255,.2);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1615; --surface:#15201e; --sunk:#1b2826; --ink:#dde7e2; --muted:#93a6a0; --line:#2c3c39; --grid:rgba(140,200,180,.05);
  --copper:#e39a62; --copper-soft:rgba(227,154,98,.15); --water:#62b9ec; --water-soft:rgba(98,185,236,.16);
  --good:#62c98f; --good-soft:rgba(98,201,143,.14); --bad:#ef6f60; --bad-soft:rgba(239,111,96,.13); --warn:#e2b25a;
  --l1:#62c98f; --l2:#62b9ec; --l3:#e39a62;
  --pcb:#2f7f56; --silk:#f2f2e6; --lead:#9aa2a8; --edge:rgba(255,255,255,.2);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--s0);line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:var(--s3);font-weight:850;font-stretch:115%}
h2{font-size:var(--s2);font-weight:800;font-stretch:108%}
h3{font-size:var(--s1);font-weight:750}
h4{font-size:var(--s0);font-weight:700}
p{margin:0}
a{color:var(--water)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.9em}
.eyebrow{font-family:var(--f-display);font-stretch:78%;font-weight:700;text-transform:uppercase;letter-spacing:.11em;font-size:var(--s-1);color:var(--muted)}
b.c{color:var(--copper);font-weight:600} b.w{color:var(--water);font-weight:600}
.muted{color:var(--muted)}

/* app shell */
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:.55rem 16px;display:flex;align-items:center;gap:.8rem}
.brand{font-family:var(--f-display);font-weight:850;font-stretch:112%;font-size:1.05rem;white-space:nowrap}
.brand span{color:var(--copper)}
.top .sp{flex:1}
.streak{display:flex;align-items:center;gap:.35rem;font-family:var(--f-mono);font-weight:600;font-size:.9rem;padding:.2rem .6rem;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.streak svg{width:14px;height:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:760px}
.tab{background:none;border:0;padding:.55rem .2rem .6rem;display:grid;justify-items:center;gap:.15rem;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-stretch:85%;font-weight:650;font-size:.78rem;border-top:2px solid transparent}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--copper)}
body.lesson .top{display:none}
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:1.2rem;padding-block:1.2rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:.6rem}

.btn{font:650 .92rem var(--f-display);font-stretch:90%;background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:6px;padding:.6rem 1rem;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none}
.btn:hover{background:var(--copper-soft)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.primary:hover{background:var(--copper);border-color:var(--copper);color:var(--surface)}
.btn.ghost{border-color:var(--line)}
.btn.small{min-height:34px;padding:.3rem .7rem;font-size:.84rem}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}

.lvl{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;padding:.12rem .5rem;border-radius:99px;border:1px solid currentColor}
.lvl.l1{color:var(--l1)} .lvl.l2{color:var(--l2)} .lvl.l3{color:var(--l3)}
.bands{display:inline-flex;gap:2px}.bands i{width:3px;height:10px;background:currentColor;border-radius:1px}

/* dnes */
.today-hero{display:grid;gap:.8rem}
.today-lesson{display:grid;gap:.7rem;border:1px solid var(--line);border-left:4px solid var(--copper);border-radius:8px;background:var(--surface);padding:1rem}
.today-lesson h2{font-size:1.5rem}
.meta{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;font-size:var(--s-1);color:var(--muted);font-family:var(--f-display);font-stretch:85%;font-weight:600}
.progress{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--copper);border-radius:99px}
.lvlprog{display:grid;gap:.5rem}
.lvlprog .row{justify-content:space-between}
.lvlprog .progress i{background:var(--pc)}
.todo{display:grid;gap:.25rem}
.todo label{display:flex;align-items:center;gap:.6rem;padding:.45rem .2rem;border-bottom:1px dashed var(--line);cursor:pointer}
.todo input[type=checkbox]{width:20px;height:20px;accent-color:var(--good);flex:none}
.todo .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:.2rem .5rem}
.todo label.done span{text-decoration:line-through;color:var(--muted)}
.addtodo{display:flex;gap:.4rem}
.addtodo input{flex:1;min-width:0}
input[type=text],input[type=date],select{font:inherit;font-size:1rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;min-height:44px;max-width:100%}

/* kurz */
.level{display:grid;gap:.7rem}
.level-head{display:grid;gap:.3rem}
.lesson-list{display:grid;gap:.4rem;list-style:none;margin:0;padding:0}
.li{display:grid;grid-template-columns:2.4rem 1fr auto;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;cursor:pointer;text-align:left;width:100%}
.li:hover{border-color:var(--copper)}
.li .n{font-family:var(--f-mono);font-weight:600;color:var(--muted);font-size:.85rem}
.li .t{font-family:var(--f-display);font-weight:700;font-stretch:92%;line-height:1.25}
.li .t small{display:block;font-family:var(--f-body);font-weight:400;font-stretch:100%;color:var(--muted);font-size:.85rem}
.li .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.li.done .ck{background:var(--good);border-color:var(--good)}
.li.done .ck svg{stroke:var(--surface)}
.li .ck svg{width:14px;height:14px;fill:none;stroke:transparent;stroke-width:3}

/* kalendář */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{font-family:var(--f-display);font-stretch:80%;font-weight:700;font-size:.72rem;text-transform:uppercase;text-align:center;color:var(--muted);padding:.2rem 0}
.day{aspect-ratio:1/1.08;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:.2rem;display:grid;grid-template-rows:auto 1fr;cursor:pointer;text-align:left;position:relative;overflow:hidden}
.day .d{font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.day .m{align-self:end;justify-self:center;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);line-height:1}
.day.out{opacity:.35}
.day.plan{border-color:var(--copper)}
.day.plan .m{color:var(--copper)}
.day.done{background:var(--good-soft);border-color:var(--good)}
.day.done .m{color:var(--good)}
.day.miss{background:var(--bad-soft)}
.day.today{outline:2px solid var(--ink);outline-offset:-2px}
.day.sel{box-shadow:inset 0 0 0 2px var(--copper)}
.day .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--water)}
.cal-legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.8rem;color:var(--muted);font-family:var(--f-display);font-stretch:85%;font-weight:600}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid;vertical-align:-2px;margin-right:.3rem}
.wd{display:flex;flex-wrap:wrap;gap:.3rem}
.wd button{min-width:42px}

/* slovníček */
.gl{display:grid;gap:.4rem}
.gl dt{font-family:var(--f-display);font-weight:750;font-stretch:95%}
.gl dd{margin:0 0 .6rem;color:var(--ink)}
.gl dd small{color:var(--muted);font-family:var(--f-display);font-stretch:85%}

/* lekce */
.lesson-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:35;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);margin-inline:-16px;padding:.5rem 16px .6rem;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:.45rem}
.lesson-top .row{flex-wrap:nowrap}
.lesson-top .ttl{flex:1;min-width:0;font-family:var(--f-display);font-weight:750;font-stretch:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:1px solid var(--line);border-radius:6px;min-width:40px;min-height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.steps button{height:26px;border:0;background:none;padding:0;cursor:pointer;display:grid;align-items:center}
.steps button i{display:block;height:5px;border-radius:99px;background:var(--sunk)}
.steps button.on i{background:var(--copper)}
.steps button.past i{background:var(--ink);opacity:.55}
.timer{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.step{display:grid;gap:1rem;padding-block:1.1rem 1rem}
.step-label{display:flex;align-items:baseline;gap:.6rem}
.step-label .k{font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:2.4rem;line-height:.8;color:var(--copper)}
.prose{display:grid;gap:.85rem;max-width:66ch}
.prose ul,.prose ol{margin:0;padding-left:1.25rem;display:grid;gap:.3rem}
.idea{font-family:var(--f-display);font-weight:700;font-stretch:95%;font-size:1.2rem;line-height:1.35;border-left:4px solid var(--copper);padding:.2rem 0 .2rem .9rem}
.terms{display:grid;gap:.5rem}
.term{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.65rem .8rem;display:grid;gap:.15rem}
.term b{font-family:var(--f-display);font-weight:750;font-stretch:95%;color:var(--copper)}
.term span{font-size:.97rem}
.note{border-left:3px solid var(--water);background:var(--water-soft);padding:.7rem .9rem;border-radius:0 6px 6px 0;display:grid;gap:.3rem}
.note.limit{border-left-color:var(--copper);background:var(--copper-soft)}
.note.try{border-left-color:var(--good);background:var(--good-soft)}
.note h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;font-stretch:85%}
pre.code{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem;overflow-x:auto;font-family:var(--f-mono);font-size:.86rem;line-height:1.5}
.formula{font-family:var(--f-mono);font-weight:600;font-size:1.15rem;color:var(--copper);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.5rem .8rem;justify-self:start}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:.55rem 16px calc(.55rem + env(safe-area-inset-bottom,0px))}
.navbar-in{max-width:760px;margin:0 auto;display:flex;gap:.6rem}
.navbar-in .btn{flex:1}

/* figury */
.fig{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.fig-title{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.45rem .8rem;border-bottom:1px solid var(--line);font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.08em}
.fig-title span:last-child{color:var(--muted);font-weight:600}
.fig-body{padding:.8rem;display:grid;gap:.9rem}
.fig svg{display:block;width:100%;height:auto;max-width:100%}
.fig canvas{display:block;width:100%;max-width:100%;touch-action:pan-y}
.cap{font-size:.86rem;color:var(--muted);line-height:1.5}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.duo>div{display:grid;gap:.3rem;justify-items:center;text-align:center;min-width:0}
.duo small{font-family:var(--f-display);font-stretch:85%;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;color:var(--muted)}
.controls{display:grid;gap:.75rem}
.ctl{display:grid;gap:.15rem}
.ctl label,.lbl{font-family:var(--f-display);font-stretch:85%;font-weight:650;font-size:.86rem;display:flex;justify-content:space-between;gap:.5rem}
.ctl output{font-family:var(--f-mono);font-weight:600;color:var(--copper)}
input[type=range]{width:100%;accent-color:var(--copper);height:28px}
.btns{display:flex;flex-wrap:wrap;gap:.4rem}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.4rem}
.ro{border:1px solid var(--line);border-radius:6px;padding:.3rem .55rem;background:var(--bg);min-width:0}
.ro small{display:block;font-family:var(--f-display);font-stretch:85%;font-weight:650;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ro b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1rem;overflow-wrap:anywhere}
.ro.w b{color:var(--water)} .ro.c b{color:var(--copper)}
.state{display:inline-block;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;padding:.15rem .55rem;border-radius:99px;border:1px solid currentColor;justify-self:start}
.state.good{color:var(--good)} .state.bad{color:var(--bad)} .state.warn{color:var(--warn)} .state.info{color:var(--water)}
.legend{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.8rem;font-family:var(--f-display);font-stretch:85%;font-weight:600}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:.3rem;border-radius:2px}
.tscroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.4rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* otázky */
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.8rem .9rem;margin:0;display:grid;gap:.5rem;min-width:0}
.q legend{font-weight:600;padding:0;float:left;width:100%;line-height:1.45}
.q legend .from{display:block;font-family:var(--f-display);font-stretch:85%;font-weight:650;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.2rem}
.q .ans{display:grid;gap:.3rem;clear:both}
.q label{display:flex;gap:.55rem;align-items:flex-start;padding:.5rem .6rem;border-radius:6px;border:1px solid var(--line);cursor:pointer;font-size:.98rem;background:var(--bg)}
.q input{accent-color:var(--copper);margin-top:.3rem;flex:none}
.q label.ok{border-color:var(--good);background:var(--good-soft)}
.q label.ko{border-color:var(--bad);background:var(--bad-soft)}
.q .why{font-size:.93rem;border-top:1px dashed var(--line);padding-top:.45rem}
.q .why b{font-family:var(--f-display);font-stretch:90%}
.score{font-family:var(--f-mono);font-weight:600}

/* SVG pomocné */
.ld{stroke:var(--lead);stroke-width:3;fill:none;stroke-linecap:round}
.ed{stroke:var(--edge);stroke-width:1}
.sy{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.syf{fill:var(--ink);stroke:none}
.pipe{fill:var(--water-soft);stroke:var(--ink);stroke-width:2}
.wl{stroke:var(--water);fill:none} .cl{stroke:var(--copper);fill:none}
.wf{fill:var(--water)} .cf{fill:var(--copper)} .if{fill:var(--ink)} .sf{fill:var(--surface)} .bf{fill:var(--bg)} .mf{fill:var(--muted)}
.tx{fill:var(--ink);font:600 12px var(--f-mono)}
.txm{fill:var(--muted);font:600 11px var(--f-display);font-stretch:85%}
.txc{fill:var(--copper);font:600 12px var(--f-mono)}
.txw{fill:var(--water);font:600 12px var(--f-mono)}
.silk{fill:none;stroke:var(--silk);stroke-width:1.5}
.silkt{fill:var(--silk);font:700 11px var(--f-mono)}
.pcbfig [data-ref]{cursor:pointer}
.pcbfig .hl .sy{stroke:var(--copper);stroke-width:3}
.pcbfig .hl .silk{stroke:#ffd166;stroke-width:2.5}
.pcbfig .hl .tx{fill:var(--copper)}
.pcbfig .hl .silkt{fill:#ffd166}

/* specifické simulace */
.sw{width:32px;height:32px;border-radius:5px;border:1px solid var(--edge);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.swatches{display:flex;flex-wrap:wrap;gap:.25rem}
.bigval{font-family:var(--f-mono);font-weight:600;font-size:clamp(1.4rem,5vw,2rem);color:var(--copper);line-height:1.15}
.pins{display:grid;grid-template-columns:1fr 1fr;gap:3px;max-width:420px;margin:0 auto;width:100%}
.pin{display:flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:.2rem .4rem;cursor:pointer;font-family:var(--f-mono);font-size:.74rem;min-height:30px;min-width:0}
.pin:nth-child(odd){flex-direction:row-reverse;text-align:right}
.pin i{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--edge)}
.pin span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin b{color:var(--muted);font-weight:600;flex:none}
.pin[aria-pressed="true"]{outline:2px solid var(--copper)}
.bb circle{cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);padding:.55rem 1rem;border-radius:99px;font-family:var(--f-display);font-weight:650;font-stretch:90%;font-size:.9rem;max-width:calc(100% - 32px)}
.done-hero{display:grid;gap:.8rem;justify-items:start}
.bigcheck{width:64px;height:64px;border-radius:50%;background:var(--good);display:grid;place-items:center}
.bigcheck svg{width:34px;height:34px;fill:none;stroke:var(--surface);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
</style>

  </header>

    <button class="tab" data-tab="kurz" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>Kurz</button>
    <button class="tab" data-tab="kalendar" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8.5 15l2 2 4-4"/></svg>Kalendář</button>

  </div>

<div class="toast" id="toast" hidden></div>
<script>
/* ================= Schémata: malý kreslicí jazyk ================= */
const S = {
  w: (pts) => `<polyline class="sy" points="${pts}"/>`,
  dot: (x, y) => `<circle class="syf" cx="${x}" cy="${y}" r="3.2"/>`,
  t: (x, y, s, cls = 'tx', a = 'start') => `<text class="${cls}" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`,
  res: (x, y, v, lab, lx, ly) => (v
    ? `<path class="sy" d="M${x} ${y - 30}V${y - 18}M${x} ${y + 18}V${y + 30}"/><rect class="sy" x="${x - 7}" y="${y - 18}" width="14" height="36"/>`
    : `<path class="sy" d="M${x - 30} ${y}H${x - 18}M${x + 18} ${y}H${x + 30}"/><rect class="sy" x="${x - 18}" y="${y - 7}" width="36" height="14"/>`)
    + (lab ? S.t(lx ?? (v ? x + 12 : x), ly ?? (v ? y + 4 : y - 12), lab, 'tx', v ? 'start' : 'middle') : ''),
  cap: (x, y, v, lab, pol) => (v
    ? `<path class="sy" d="M${x} ${y - 30}V${y - 4}M${x - 13} ${y - 4}H${x + 13}M${x - 13} ${y + 4}H${x + 13}M${x} ${y + 4}V${y + 30}"/>` + (pol ? S.t(x - 20, y - 8, '+', 'tx') : '')
    : `<path class="sy" d="M${x - 30} ${y}H${x - 4}M${x - 4} ${y - 13}V${y + 13}M${x + 4} ${y - 13}V${y + 13}M${x + 4} ${y}H${x + 30}"/>`)
    + (lab ? S.t(v ? x + 18 : x, v ? y + 4 : y - 18, lab, 'tx', v ? 'start' : 'middle') : ''),
  bat: (x, y, lab) => `<path class="sy" d="M${x} ${y - 30}V${y - 4}M${x - 14} ${y - 4}H${x + 14}M${x} ${y + 4}V${y + 30}"/><path class="sy" style="stroke-width:5" d="M${x - 7} ${y + 4}H${x + 7}"/>` + S.t(x - 22, y - 6, '+', 'tx') + (lab ? S.t(x + 20, y + 5, lab, 'tx') : ''),
  gnd: (x, y) => `<path class="sy" d="M${x} ${y - 10}V${y}M${x - 12} ${y}H${x + 12}M${x - 7} ${y + 5}H${x + 7}M${x - 3} ${y + 10}H${x + 3}"/>`,
  diode: (x, y, dir, lab, kind) => {
    // dir: 'down' | 'right' ; spans ±30
    let d, bar, ar = '';
    if (dir === 'down') {
      d = `M${x} ${y - 30}V${y - 10}M${x - 11} ${y - 10}H${x + 11}L${x} ${y + 9}Z`;
      bar = kind === 'z' ? `M${x - 15} ${y + 13}L${x - 11} ${y + 9}H${x + 11}L${x + 15} ${y + 5}` : `M${x - 11} ${y + 9}H${x + 11}`;
      d += `M${x} ${y + 9}V${y + 30}`;
      if (kind === 'led') ar = `<path class="sy" d="M${x + 14} ${y - 4}l10 -8M${x + 18} ${y + 5}l10 -8"/><path class="syf" d="M${x + 26} ${y - 14}l-6 1 3 4zM${x + 30} ${y - 5}l-6 1 3 4z"/>`;
    } else {
      d = `M${x - 30} ${y}H${x - 10}M${x - 10} ${y - 11}V${y + 11}L${x + 9} ${y}Z`;
      bar = kind === 'z' ? `M${x + 5} ${y - 15}L${x + 9} ${y - 11}V${y + 11}L${x + 13} ${y + 15}` : `M${x + 9} ${y - 11}V${y + 11}`;
      d += `M${x + 9} ${y}H${x + 30}`;
      if (kind === 'led') ar = `<path class="sy" d="M${x - 2} ${y - 14}l8 -10M${x + 7} ${y - 12}l8 -10"/><path class="syf" d="M${x + 8} ${y - 27}l-5 2 4 3zM${x + 17} ${y - 25}l-5 2 4 3z"/>`;
    }
    return `<path class="sy" d="${d}"/><path class="sy" d="${bar}"/>${ar}` + (lab ? S.t(dir === 'down' ? x - 16 : x, dir === 'down' ? y + 4 : y + 26, lab, 'tx', dir === 'down' ? 'end' : 'middle') : '');
  },
  sw: (x, y, closed, lab) => `<path class="sy" d="M${x - 30} ${y}H${x - 14}M${x + 14} ${y}H${x + 30}"/><circle class="sy" cx="${x - 14}" cy="${y}" r="2.5"/><circle class="sy" cx="${x + 14}" cy="${y}" r="2.5"/><path class="sy" d="M${x - 12} ${y - 1}L${x + 13} ${closed ? y - 3 : y - 15}"/>` + (lab ? S.t(x, y + 20, lab, 'tx', 'middle') : ''),
  btn: (x, y, v, lab) => v
    ? `<path class="sy" d="M${x} ${y - 30}V${y - 12}M${x} ${y + 12}V${y + 30}"/><circle class="sy" cx="${x}" cy="${y - 12}" r="2.5"/><circle class="sy" cx="${x}" cy="${y + 12}" r="2.5"/><path class="sy" d="M${x - 8} ${y - 14}V${y + 14}M${x - 8} ${y}H${x - 20}M${x - 20} ${y - 6}V${y + 6}"/>` + (lab ? S.t(x + 12, y + 4, lab) : '')
    : '',
  coil: (x, y, v, lab, core) => {
    let d;
    if (v) { d = `M${x} ${y - 30}V${y - 20}`; for (let i = 0; i < 4; i++) d += `a5 5 0 0 1 0 10`; d += `V${y + 30}`; }
    else { d = `M${x - 30} ${y}H${x - 20}`; for (let i = 0; i < 4; i++) d += `a5 5 0 0 1 10 0`; d += `H${x + 30}`; }
    const c = core ? (v ? `<path class="sy" d="M${x - 5} ${y - 20}V${y + 20}M${x - 9} ${y - 20}V${y + 20}"/>` : `<path class="sy" d="M${x - 20} ${y - 8}H${x + 20}M${x - 20} ${y - 12}H${x + 20}"/>`) : '';
    return `<path class="sy" d="${d}"/>${c}` + (lab ? S.t(v ? x + 12 : x, v ? y + 4 : y + 22, lab, 'tx', v ? 'start' : 'middle') : '');
  },
  arrowHead: (x1, y1, x2, y2, t, size = 8, inward) => {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    let tx = x1 + dx * t, ty = y1 + dy * t; const s = inward ? -1 : 1;
    const bx = tx - ux * size * s, by = ty - uy * size * s, px = -uy * size * .5, py = ux * size * .5;
    return `<path class="syf" d="M${tx.toFixed(1)} ${ty.toFixed(1)}L${(bx + px).toFixed(1)} ${(by + py).toFixed(1)}L${(bx - px).toFixed(1)} ${(by - py).toFixed(1)}Z"/>`;
  },
  npn: (x, y, lab, pnp) => {
    const bx = x - 8;
    let s = `<circle class="sy" cx="${x}" cy="${y}" r="19"/><path class="sy" d="M${x - 32} ${y}H${bx}M${bx} ${y - 12}V${y + 12}M${bx} ${y - 6}L${x + 10} ${y - 16}V${y - 32}M${bx} ${y + 6}L${x + 10} ${y + 16}V${y + 32}"/>`;
    s += pnp ? S.arrowHead(bx, y + 6, x + 10, y + 16, .25, 8, true) : S.arrowHead(bx, y + 6, x + 10, y + 16, .9);
    return s + (lab ? S.t(x + 24, y + 4, lab) : '');
  },
  pin: (x, y, lab, anchor = 'end') => `<circle cx="${x}" cy="${y}" r="4" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"/>` + S.t(anchor === 'end' ? x - 9 : x + 9, y + 4, lab, 'txc', anchor),
  pinT: (x, y, lab) => `<circle cx="${x}" cy="${y}" r="4" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"/>` + S.t(x, y - 10, lab, 'txc', 'middle'),
  diodeUp: (x, y) => `<g transform="rotate(180 ${x} ${y})">${S.diode(x, y, 'down')}</g>`,
  motor: (x, y) => `<circle class="sy" cx="${x}" cy="${y}" r="16"/>` + S.t(x, y + 5, 'M', 'tx', 'middle'),
  svg: (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label || 'Schéma'}">${inner}</svg>`,
};

/* ================= Obrázky součástek (fyzický vzhled) ================= */
const PART = {
  resistor: (b = ['#d0312d', '#7d3fb5', '#ef7d1a', '#c9a227']) => `<svg viewBox="0 0 120 70" aria-hidden="true"><line class="ld" x1="2" y1="35" x2="118" y2="35"/><rect x="30" y="23" width="60" height="24" rx="10" fill="#d8c291" class="ed"/>${[39, 49, 59, 77].map((x, i) => `<rect x="${x}" y="23" width="5" height="24" fill="${b[i]}"/>`).join('')}</svg>`,
  ceramic: `<svg viewBox="0 0 120 70" aria-hidden="true"><line class="ld" x1="52" y1="45" x2="52" y2="68"/><line class="ld" x1="68" y1="45" x2="68" y2="68"/><circle cx="60" cy="27" r="23" fill="#d98a2b" class="ed"/><text x="60" y="32" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="13" font-weight="600" fill="#3b2410">104</text></svg>`,
  elyt: `<svg viewBox="0 0 120 70" aria-hidden="true"><line class="ld" x1="52" y1="56" x2="52" y2="69"/><line class="ld" x1="68" y1="56" x2="68" y2="64"/><rect x="40" y="3" width="40" height="55" rx="6" fill="#1f3d78" class="ed"/><rect x="67" y="3" width="11" height="55" fill="#b9c8e0"/><text x="72.5" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3d78">–</text><text x="72.5" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3d78">–</text><text x="30" y="68" text-anchor="middle" class="txm">+</text></svg>`,
  coil: `<svg viewBox="0 0 120 70" aria-hidden="true"><line class="ld" x1="4" y1="35" x2="30" y2="35"/><line class="ld" x1="90" y1="35" x2="116" y2="35"/><rect x="26" y="25" width="68" height="20" rx="3" fill="#3b3b3b"/><path d="M32 21 l5 28 M40 21 l5 28 M48 21 l5 28 M56 21 l5 28 M64 21 l5 28 M72 21 l5 28 M80 21 l5 28" stroke="#c87533" stroke-width="3.2" fill="none"/></svg>`,
  diode: `<svg viewBox="0 0 120 70" aria-hidden="true"><line class="ld" x1="2" y1="35" x2="118" y2="35"/><rect x="38" y="26" width="44" height="18" rx="3" fill="#242424" class="ed"/><rect x="71" y="26" width="6" height="18" fill="#d4d4d4"/><text x="74" y="62" text-anchor="middle" class="txm">katoda</text></svg>`,
  led: `<svg viewBox="0 0 120 80" aria-hidden="true"><line class="ld" x1="52" y1="50" x2="52" y2="78"/><line class="ld" x1="68" y1="50" x2="68" y2="68"/><path d="M42 50 V26 a18 18 0 0 1 36 0 V50 Z" fill="#e63b2e" opacity=".88" class="ed"/><rect x="39" y="47" width="42" height="5" rx="1" fill="#b82a20"/><path d="M50 20 a10 10 0 0 1 8 -8" stroke="#fff" stroke-width="2.5" fill="none" opacity=".6"/><text x="44" y="76" text-anchor="end" class="txm">A +</text><text x="76" y="66" class="txm">K −</text></svg>`,
  npn: `<svg viewBox="0 0 120 80" aria-hidden="true"><line class="ld" x1="48" y1="48" x2="48" y2="70"/><line class="ld" x1="60" y1="48" x2="60" y2="70"/><line class="ld" x1="72" y1="48" x2="72" y2="70"/><path d="M40 50 V24 a20 20 0 0 1 40 0 V50 Z" fill="#232323" class="ed"/><text x="60" y="38" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#bbb">BC547</text><text x="48" y="79" text-anchor="middle" class="txm">C</text><text x="60" y="79" text-anchor="middle" class="txm">B</text><text x="72" y="79" text-anchor="middle" class="txm">E</text></svg>`,
  ic: `<svg viewBox="0 0 120 70" aria-hidden="true"><g fill="#b8bcc2"><rect x="36" y="8" width="6" height="12"/><rect x="50" y="8" width="6" height="12"/><rect x="64" y="8" width="6" height="12"/><rect x="78" y="8" width="6" height="12"/><rect x="36" y="50" width="6" height="12"/><rect x="50" y="50" width="6" height="12"/><rect x="64" y="50" width="6" height="12"/><rect x="78" y="50" width="6" height="12"/></g><rect x="28" y="18" width="64" height="34" rx="2" fill="#262626" class="ed"/><path d="M28 29 a6 6 0 0 1 0 12" fill="#555"/><circle cx="36" cy="45" r="2.2" fill="#777"/></svg>`,
};
const duo = (a, b, la, lb) => `<div class="duo"><div>${a}<small>${la}</small></div><div>${b}<small>${lb}</small></div></div>`;
const figWrap = (title, sub, inner, cap) => `<figure class="fig"><div class="fig-title"><span>${title}</span><span>${sub || ''}</span></div><div class="fig-body">${inner}${cap ? `<p class="cap">${cap}</p>` : ''}</div></figure>`;

/* ================= Obrázky k lekcím ================= */
const FIG = {
  'l1-01': () => figWrap('Schéma', 'baterie a rezistor', S.svg(300, 150,
    S.bat(70, 75, '9 V') + S.w('70,45 70,25 230,25 230,45') + S.res(230, 75, true, '100 Ω') + S.w('230,105 230,125 70,125 70,105')
    + `<path class="cl" style="stroke-width:2" d="M120 15H180"/>` + S.arrowHead(120, 15, 180, 15, 1).replace('syf', 'cf') + S.t(150, 11, 'I = 90 mA', 'txc', 'middle')
    + S.t(150, 80, 'U = 9 V', 'txw', 'middle'), 'Baterie 9 V připojená k rezistoru 100 ohmů'),
    'Čáry jsou vodiče, obdélník je rezistor (česká norma), dvojice čárek je baterie; delší čárka je plus. Šipka ukazuje směr proudu od + přes součástky k −.'),

  'l1-02': () => figWrap('Schematické značky', 'základní sada', `<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
    ${[[S.svg(80, 70, S.bat(40, 35)), 'baterie'], [S.svg(80, 70, S.sw(40, 38, false)), 'spínač'], [S.svg(80, 70, S.res(40, 35, false)), 'rezistor'],
      [S.svg(80, 70, S.diode(40, 42, 'right', '', 'led')), 'LED'], [S.svg(80, 70, S.gnd(40, 34)), 'zem (GND)'], [S.svg(80, 70, S.w('10,35 70,35') + S.w('40,35 40,60') + S.dot(40, 35) + S.w('10,15 70,15')), 'spoj / křížení']]
      .map(([s, l]) => `<div>${s}<small>${l}</small></div>`).join('')}</div>`, 'Křížení bez tečky neznamená spojení. Vodiče jsou spojené jen tam, kde je tečka.'),

  'l1-03': () => figWrap('Pod povrchem pole', 'kovové proužky', S.svg(320, 150, (() => {
    let s = '';
    s += `<path d="M20 14H300M20 26H300" style="stroke:var(--bad);stroke-width:4;opacity:.8"/><path d="M20 124H300M20 136H300" style="stroke:var(--water);stroke-width:4;opacity:.8"/>`;
    for (let i = 0; i < 12; i++) { const x = 34 + i * 23; s += `<rect x="${x - 4}" y="38" width="8" height="34" rx="2" style="fill:var(--copper);opacity:.75"/><rect x="${x - 4}" y="80" width="8" height="34" rx="2" style="fill:var(--copper);opacity:.75"/>`; }
    s += `<rect x="20" y="74" width="280" height="4" style="fill:var(--muted);opacity:.4"/>` + S.t(312, 18, '+', 'tx') + S.t(312, 30, '−', 'tx') + S.t(10, 60, 'a–e', 'txm', 'middle') + S.t(10, 102, 'f–j', 'txm', 'middle');
    return s;
  })(), 'Kovové proužky uvnitř nepájivého pole'), 'Svislé měděné proužky spojují vždy pět děr v jednom sloupci. Vodorovné lišty nahoře a dole vedou napájení po celé délce.'),

  'l1-04': () => figWrap('Součástka a značka', 'rezistor', duo(PART.resistor(), S.svg(120, 70, S.res(60, 24, false) + S.w('10,56 30,56 35,46 45,66 55,46 65,66 75,46 85,66 90,56 110,56')), 'vzhled', 'značka ČSN/IEC (nahoře) a USA'), 'V českých schématech se kreslí obdélník. Klikatá čára je americká značka; najdeš ji v mnoha anglických návodech.'),

  'l1-05': () => figWrap('LED a zapojení', 'GPIO17 → rezistor → LED → GND', duo(PART.led, S.svg(120, 80, S.diode(60, 40, 'down', '', 'led')), 'delší nožička = anoda', 'značka LED')
    + S.svg(320, 110, S.pinT(30, 50, 'GPIO17') + S.w('34,50 90,50') + S.res(120, 50, false, '220 Ω') + S.w('150,50 180,50') + S.diode(210, 50, 'right', 'LED', 'led') + S.w('240,50 280,50 280,75') + S.gnd(280, 85), 'GPIO17, rezistor 220 ohmů, LED, zem'),
    'Na pořadí rezistoru a LED nezáleží. Důležité je, aby LED mířila „šipkou" ke GND.'),

  'l1-07': () => figWrap('Pull-up rezistor', 'tlačítko proti GND', S.svg(300, 200,
    S.t(80, 18, '3,3 V', 'txc', 'middle') + S.w('80,24 80,40') + S.res(80, 70, true, '10 kΩ') + S.w('80,100 80,120') + S.dot(80, 120) + S.w('80,120 200,120') + S.pin(204, 120, 'GPIO27', 'start')
    + S.btn(80, 150, true, '') + S.gnd(80, 190) + S.t(100, 154, 'tlačítko', 'txm'),
    'Pull-up rezistor 10 kiloohmů ke 3,3 V, tlačítko ke GND'), 'V klidu teče rezistorem zanedbatelný proud a pin „vidí" 3,3 V (1). Stisk spojí pin s GND (0).'),

  'l1-08': () => figWrap('Dělič napětí', '5 V → 3,3 V', S.svg(300, 220,
    S.t(80, 16, 'U vstup = 5 V', 'txc', 'middle') + S.w('80,22 80,40') + S.res(80, 70, true, 'R1 = 1 kΩ') + S.w('80,100 80,110') + S.dot(80, 110) + S.w('80,110 190,110') + S.pin(194, 110, 'U výstup ≈ 3,3 V', 'start')
    + S.w('80,110 80,120') + S.res(80, 150, true, 'R2 = 2 kΩ') + S.w('80,180 80,195') + S.gnd(80, 205), 'Dělič napětí z rezistorů 1 a 2 kiloohmy'),
    'U výstup = U vstup · R2 / (R1 + R2) = 5 · 2 / 3 ≈ 3,33 V.'),

  'l1-09': () => figWrap('Tranzistor jako spínač', 'spínání na straně GND', S.svg(320, 230,

  body: `<p>Rezistor je <b class="c">elektrické tření</b>. Omezuje proud podobně jako kohoutek. Kdyby kohoutek uměl jen „zavřeno" a „naplno", sklenici vody bys nenaplnil. Rezistor dovolí nastavit přesně tolik proudu, kolik součástka snese.</p>

  body: `<p>LED sama proud neomezuje. Dokud je napětí pod asi 2 V, nesvítí. Jakmile ho překročí, proud prudce roste a LED se během chvilky zničí. Proto s ní vždy zapojujeme rezistor.</p>
  <p>Výpočet: od napětí zdroje odečteme úbytek na LED a zbytek „padne" na rezistoru.</p><p class="formula">R = (U zdroje − U_F) / I</p>
  <p>Pro GPIO (3,3 V), červenou LED (2,0 V) a proud 6 mA: R = (3,3 − 2,0) / 0,006 ≈ 217 Ω. Zvolíme nejbližší vyšší běžnou hodnotu: <b>220 Ω</b>. Pro napájení 5 V a 10 mA vychází 300 Ω, tedy 330 Ω.</p>
  <p>Zapojení: GPIO17 → rezistor 220 Ω → anoda LED, katoda → GND. Program v Pythonu s knihovnou gpiozero:</p>

{ id: 'l1-06', lvl: 1, title: 'Piny GPIO na Raspberry Pi', sub: '40 pinů a jejich pravidla',

  body: `<p>Raspberry Pi má 40pinový konektor. Většina pinů jsou <b class="c">GPIO</b>. V programu určíš, jestli pin bude <em>výstup</em> (zapíná LED) nebo <em>vstup</em> (čte tlačítko).</p>
  <ul><li>Výstup HIGH = 3,3 V, LOW = 0 V.</li>
  <li>Vstup čte napětí: blízko 3,3 V je 1, blízko 0 V je 0. <b>Nikdy na něj nepřiváděj 5 V.</b> Raspberry Pi nemá ochranu a pin, případně celý čip, se může zničit.</li>
  <li>Z jednoho pinu ber jen pár miliampérů: bezpečně do asi 8 mA, nejvýš 16 mA. Ze všech GPIO dohromady zhruba do 50 mA. Na LED to stačí, na motor, relé nebo LED pásek ne. Na ty je tranzistor (lekce 9).</li>
  <li>Piny <b>5V</b> a <b>3V3</b> jsou napájecí a nedají se ovládat.</li></ul>
  <p>Pozor na dvojí číslování. <b>Fyzické</b> číslo je pozice na konektoru. <b>BCM</b> je číslo GPIO v čipu. Když v kódu napíšeš <span class="mono">LED(17)</span>, myslíš GPIO17, a ten je fyzicky na pinu 11.</p>
  <div class="note"><h4>Jak se zorientovat</h4><p>Pin 1 má na desce čtvercovou pájecí plošku a je na konci konektoru, který je dál od USB portů. V terminálu Raspberry Pi vypíše mapu pinů příkaz <span class="mono">pinout</span>.</p></div>`,
